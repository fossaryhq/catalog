# Home Assistant rejects proxied requests until configuration.yaml sets
# use_x_forwarded_for and lists this proxy's address in trusted_proxies.
server {
    listen 80;
    server_name home.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name home.example.com;

    ssl_certificate /etc/letsencrypt/live/home.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The interface runs on WebSocket: without the upgrade the panel stays blank.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long-lived event subscriptions must not be cut off by a timeout.
        proxy_read_timeout 3600s;
    }
}
