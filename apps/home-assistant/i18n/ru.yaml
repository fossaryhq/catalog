tagline: Центр умного дома, который работает без облака производителей
summary: >-
  Home Assistant объединяет лампы, датчики, кондиционеры, телевизоры и роботы
  разных производителей в один интерфейс и выполняет автоматизации на своём
  сервере, а не в чужом облаке. Больше двух тысяч интеграций, панель управления
  с историей состояний, редактор автоматизаций и приложения для Android и iOS.
categories:
  - Умный дом
license_notes: >-
  Само приложение бесплатно и не требует подписки. Платная подписка Nabu Casa
  Home Assistant Cloud нужна только для внешнего доступа без своего домена и
  для облачных голосовых ассистентов; этот рецепт её не использует.
security_known_risks:
  - "Учётная запись Home Assistant управляет замками, камерами и отоплением: публиковать панель без HTTPS и без двухфакторной аутентификации нельзя."
  - За reverse proxy Home Assistant отвергает запросы, пока в configuration.yaml не заданы use_x_forwarded_for и trusted_proxies; указание в trusted_proxies лишней подсети позволяет подделать адрес клиента и обойти защиту от подбора пароля.
  - Каталог /config хранит токены доступа, пароли интеграций и историю состояний дома, поэтому архивы backup нужно шифровать и держать вне сервера.
  - "Официальная установка Container не имеет Supervisor: автоматический поиск устройств, Bluetooth и USB-адаптеры требуют host network, privileged или проброса устройств, что расширяет права контейнера и в рецепт не включено."
  - Обновления выходят раз в месяц и регулярно содержат несовместимые изменения интеграций, поэтому обновляться без backup и чтения release notes нельзя.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 пока не проверялся.
  - Рецепт работает в изолированной сети Compose, поэтому автоматический поиск устройств по mDNS, SSDP и DHCP не проверялся и без host network не работает.
  - Bluetooth и USB-адаптеры Zigbee или Z-Wave в рецепт не подключены и не проверялись.
  - В варианте установки Container отсутствует Supervisor, поэтому add-ons и встроенное обновление из панели не проверялись и недоступны.
screenshot_alts:
  - Панель Home Assistant с комнатами, выключателями света, термостатом и графиком температуры в тёмной теме
  - Редактор автоматизации с триггером по закату, условием и двумя действиями включения света в светлой теме
  - История состояний с графиками температуры в двух комнатах и за окном и влажности в гостиной в светлой теме
  - Список комнат дома с числом привязанных к каждой устройств в тёмной теме
