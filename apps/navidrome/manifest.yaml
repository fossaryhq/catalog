schema_version: 6
publication_status: published

slug: navidrome
name: Navidrome
tagline: Your own music streaming service for a file collection
summary: >-
  Navidrome turns a folder of music into a personal streaming service: it reads
  tags and artwork, remembers your listening history, and serves the collection
  to the browser and to dozens of mobile apps through the Subsonic API. One
  container, an SQLite database, no subscription.

status: active
editorial_status: recommended

links:
  website: https://www.navidrome.org/
  source: https://github.com/navidrome/navidrome
  documentation: https://www.navidrome.org/docs/
  issues: https://github.com/navidrome/navidrome/issues

classification:
  categories:
    - Music
  tags:
    - music
    - subsonic
    - streaming
    - homelab
  implementation_languages:
    - Go
    - JavaScript
  alternatives_to:
    - Spotify
    - Apple Music
    - Яндекс Музыка

license:
  spdx: GPL-3.0-only
  kind: open_source
  restrictions: []
  notes: >-
    The project ships no mobile apps of its own: clients are third-party and work
    through the Subsonic API. The server and web interface are entirely free
    software with no paid features.

