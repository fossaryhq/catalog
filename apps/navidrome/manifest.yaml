security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - "Whoever opens the web interface first creates the administrator: do not expose the port until that account exists."
    - The container runs as root, as in the upstream image; set `user:` and adjust volume ownership yourself to reduce the risk.
    - The Subsonic API authenticates clients with a password-derived token, and some clients still send the password in clear text, so publish the server over HTTPS only.
    - Anonymous usage statistics are disabled in this recipe; enabling them sends data about your instance to the developers.
  assessment:
    status: warnings
    assessed_at: "2026-08-31"

