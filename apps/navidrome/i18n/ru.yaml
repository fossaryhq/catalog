tagline: Свой музыкальный стриминг для коллекции из файлов
summary: >-
  Navidrome превращает папку с музыкой в личный стриминговый сервис: он читает
  теги и обложки, помнит историю прослушиваний и отдаёт коллекцию в браузер и в
  десятки мобильных приложений через Subsonic API. Один контейнер, база SQLite,
  никакой подписки.
categories:
  - Музыка
license_notes: >-
  Собственных мобильных приложений у проекта нет: клиенты сторонние и работают
  через Subsonic API. Веб-интерфейс и сервер полностью свободны, платных
  функций нет.
security_known_risks:
  - "Первый, кто откроет веб-интерфейс, создаёт администратора: до создания учётной записи порт нельзя открывать наружу."
  - Контейнер работает от root, как в образе upstream; для снижения рисков задайте `user:` и права на volume вручную.
  - Subsonic API аутентифицирует клиентов токеном на основе пароля, а часть клиентов до сих пор шлёт пароль открытым текстом, поэтому публиковать сервер допустимо только по HTTPS.
  - Отправка анонимной статистики в рецепте выключена; при включении данные об инстансе уходят разработчикам.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 и ARMv7 пока не проверялись.
  - Smoke-тест поднимает сервер и проверяет API, но не сканирует медиатеку и не проверяет транскодирование.
screenshot_alts:
  - Сетка альбомов Navidrome с обложками и исполнителями в тёмной теме
  - Страница альбома со списком треков, длительностью и кнопкой воспроизведения в светлой теме
  - Проигрыватель с текущим треком, обложкой и очередью воспроизведения
  - Список всех треков с колонками исполнителя, альбома, длительности и рейтинга
  - Список исполнителей с числом альбомов, треков и объёмом медиатеки
