tagline: Рецепты, меню и список покупок для вашего дома
summary: >-
  Mealie хранит рецепты, планы питания и списки покупок в одном домашнем
  приложении. Сохраняйте рецепт с сайта или добавляйте свой, собирайте блюда в
  кулинарные книги и планируйте меню на неделю вместе с домочадцами. Этот рецепт
  использует SQLite и один постоянный том для базы и загруженных файлов.
categories:
  - Еда и кулинария
license_notes: null
security_known_risks:
  - Пароль начальной учётной записи опубликован в документации; замените его через loopback до предоставления доступа другим пользователям.
  - Импорт рецепта по URL выполняет исходящие запросы с сервера; разрешайте доступ только доверенным пользователям и по возможности изолируйте контейнер от чувствительных внутренних сервисов.
  - Рецепты, данные домохозяйства, изображения и SQLite-база находятся в одном томе; защищайте том и резервные копии вне сервера.
  - Mealie по умолчанию задаёт HOST_IP=* и доверяет пересылаемым заголовкам от любого подключающегося источника; ограничьте параметр адресом или сетью прокси и закройте прямой доступ извне.
license_restrictions: []
smoke_test_limitations:
  - Проверки health, входа, API, backup и restore выполнены на amd64; arm64 не проверялась.
  - Smoke-тест проверяет сохранность данных и вход после восстановления, но не импортирует рецепт, не проверяет email, OIDC или внешние URL-импорты.
