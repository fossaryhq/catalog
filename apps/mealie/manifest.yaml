schema_version: 6
publication_status: published

slug: mealie
name: Mealie
tagline: Recipes, meal planning, and shopping lists for your household
summary: >-
  Mealie keeps recipes, meal plans, and shopping lists in one self-hosted
  kitchen organizer. Save a recipe from a website or add it yourself, organize
  meals into cookbooks, and plan the week together with your household. This
  recipe uses SQLite and one persistent volume for the database and uploads.

status: active
editorial_status: experimental

links:
  website: https://mealie.io/
  source: https://github.com/mealie-recipes/mealie
  documentation: https://docs.mealie.io/
