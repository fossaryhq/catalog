  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: v3.29.0
  images:
    - name: ghcr.io/mealie-recipes/mealie
      tag_source: env
  tested_at: "2026-10-21"
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-10-21"
      application_version: v3.29.0
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
      smoke_test: full
      restore_tested: true
  license: MIT
  smoke_test_limitations:
    - Full health, login, API, backup, and restore checks ran on amd64; arm64 was not tested.
    - The smoke test verifies persistence and login after restore but does not import a recipe, send email, test OIDC, or exercise external URL imports.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - The documented initial account password is public; replace it over loopback before making the service reachable to other users.
    - Recipe URL imports make outbound requests from the server; allow access only to trusted users and isolate the container from sensitive internal services where practical.
    - Recipes, household data, uploaded images, and the SQLite database share one volume; protect the volume and off-server backups.
    - Mealie defaults HOST_IP to *, trusting forwarded headers from every connecting source; restrict it to the reverse proxy address or network and prevent direct untrusted access when forwarding headers are used.
  assessment:
    status: warnings
    assessed_at: "2026-10-21"

