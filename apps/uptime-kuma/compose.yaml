name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-2.5.3}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - uptime-kuma-data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  uptime-kuma-data:
    name: ${UPTIME_KUMA_DATA_VOLUME:-uptime-kuma-data}
