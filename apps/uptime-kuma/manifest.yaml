schema_version: 6
publication_status: published

slug: uptime-kuma
name: Uptime Kuma
tagline: Uptime monitoring for websites, ports, and certificates
summary: >-
  Uptime Kuma checks HTTP endpoints, TCP ports, DNS, ping, and certificate
  expiry, then notifies you through Telegram, email, or a webhook. It also
  publishes status pages. One container and a local Docker volume are enough.

status: active
editorial_status: recommended

