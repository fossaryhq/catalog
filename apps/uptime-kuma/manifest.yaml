security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Monitoring Docker containers needs Docker API access, which this recipe does not grant; add it through a restricted socket proxy, because the raw socket is equivalent to root on the host.
