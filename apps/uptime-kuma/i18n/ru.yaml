tagline: Красивый мониторинг доступности сайтов и сервисов
summary: >-
  Uptime Kuma проверяет HTTP, TCP, DNS, ping и другие типы целей, отправляет уведомления и публикует страницы состояния. Для базового запуска достаточно одного контейнера и локального Docker volume.
categories:
  - Мониторинг
license_notes: null
security_known_risks:
  - Для мониторинга Docker-контейнеров требуется отдельная настройка доступа к Docker API.
license_restrictions: []
smoke_test_limitations:
  - Smoke-тест приложения, включая резервное копирование и восстановление прошёл на amd64 2026-10-09. arm64 и armv7 в этом прогоне не проверялись.
screenshot_alts:
  - Панель Uptime Kuma с группами проверок и графиком ответа в тёмной теме
  - Карточка проверки с историей heartbeat и графиком времени ответа в светлой теме
  - Форма добавления проверки с типом, интервалом и HTTP-параметрами
  - Публичная страница статуса со списком сервисов и их доступностью
