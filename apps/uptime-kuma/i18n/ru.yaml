tagline: Красивый мониторинг доступности сайтов и сервисов
summary: >-
  Uptime Kuma проверяет HTTP, TCP, DNS, ping и другие типы целей, отправляет
  уведомления и публикует страницы состояния. Для базового запуска достаточно
  одного контейнера и локального Docker volume.
categories:
  - Мониторинг
license_notes: null
security_known_risks:
  - Для мониторинга Docker-контейнеров требуется отдельная настройка доступа к Docker API.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke и восстановление пройдены на amd64; ARM64 и ARMv7 пока не проверены.
screenshot_alts:
  - Панель Uptime Kuma со сводкой проверок и лентой событий в тёмной теме
  - Карточка проверки с историей heartbeat и графиком времени ответа в светлой теме
  - Форма добавления проверки с типом, интервалом и HTTP-параметрами
  - Публичная страница статуса со списком сервисов и их доступностью
  - Настройка уведомлений в Telegram с полями токена бота и chat ID
