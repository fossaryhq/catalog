      tag_source: pinned
    - name: postgres
      tag_source: pinned
  tested_at: "2026-09-03"
  tested_architectures:
    amd64: passed
    arm64: passed
  smoke_test: full
  check_history:
    - tested_at: "2026-09-03"
      application_version: 2.3.3
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: passed
      smoke_test: full
      restore_tested: true
    - tested_at: "2026-09-02"
      application_version: 2.3.3
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
      smoke_test: partial
      restore_tested: false
  license: MIT
  smoke_test_limitations:
    - The full application smoke test passed on amd64 and arm64.
    - A practical backup and restore test passed on amd64; restore was not tested on arm64.
    - Feed polling, the Google Reader and Fever APIs, OAuth2 sign-in, and passkeys are not exercised by the smoke test.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - The poller fetches arbitrary URLs from the server on a schedule, so it reaches whatever the container network reaches; restrict egress when the instance is shared.
    - The administrator password and the PostgreSQL password live in .env; set the file mode to 600, keep it out of Git, and encrypt backups.
    - TRUSTED_REVERSE_PROXY_NETWORKS is limited to loopback, so forwarded client-IP and proxy-authentication headers are ignored until an operator widens it deliberately.
    - Google Reader and Fever API keys grant full access to the account that issued them and are stored in the same database as everything else.
  assessment:
    status: not_assessed
    assessed_at: null

