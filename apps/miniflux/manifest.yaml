schema_version: 6
publication_status: published

slug: miniflux
name: Miniflux
tagline: A minimalist feed reader with the Google Reader API
summary: >-
  Miniflux is one Go binary and one PostgreSQL database: no plugins, no
  recommendation feed, no account anywhere else. It reads RSS, Atom, JSON Feed,
  and RDF, pulls the full article when a feed ships only an excerpt, and serves
  the Google Reader and Fever APIs so existing mobile readers sync against it.

status: active
editorial_status: experimental

links:
  website: https://miniflux.app/
  source: https://github.com/miniflux/v2
  documentation: https://miniflux.app/docs/
  issues: https://github.com/miniflux/v2/issues

