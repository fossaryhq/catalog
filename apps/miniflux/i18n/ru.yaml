tagline: Минималистичная читалка лент с Google Reader API
summary: >-
  Miniflux — это один бинарник на Go и одна база PostgreSQL: без плагинов, без
  ленты рекомендаций и без учётной записи на чужом сервере. Он читает RSS, Atom,
  JSON Feed и RDF, догружает полный текст, когда в ленте только анонс, и отдаёт
  Google Reader и Fever API, чтобы привычные мобильные читалки синхронизировались
  с ним.
categories:
  - RSS и новости
license_notes: null
security_known_risks:
  - Сборщик по расписанию запрашивает произвольные URL с сервера и достаёт всё, что доступно сети контейнера; ограничьте исходящий трафик, если инстансом пользуется не только владелец.
  - Пароль администратора и пароль PostgreSQL лежат в .env; поставьте файлу режим 600, держите его вне Git и шифруйте резервные копии.
  - TRUSTED_REVERSE_PROXY_NETWORKS ограничен loopback, поэтому заголовки с IP клиента и заголовок proxy-аутентификации игнорируются, пока оператор осознанно не расширит список.
  - Ключи Google Reader и Fever API дают полный доступ к выдавшей их учётной записи и хранятся в той же базе, что и всё остальное.
license_restrictions: []
smoke_test_limitations:
  - Полный прикладной smoke-тест прошёл на amd64 и arm64.
  - Практическая проверка backup и restore прошла на amd64; на arm64 восстановление не проверялось.
  - Опрос лент, Google Reader и Fever API, вход через OAuth2 и passkeys smoke-тестом не проверяются.
