  license: MIT
  smoke_test_limitations:
  - On amd64, the smoke verifies live HTTP delivery, blocked anonymous topic reads/writes and signup, exact attachment bytes, a regular account, token scope through topic ACLs, subscriptions/settings, and recovery after deleting the data volume; arm64 was not tested.
  - Attachment URLs are bearer links and intentionally remain downloadable without login when the URL is known. The test verifies this behavior; it does not establish private or end-to-end encrypted attachments.
  - Browser Web Push, Android/iOS background delivery, Firebase, upstream polling, SMTP, calls, external integrations, TLS proxies, and long-term retention/expiry were not exercised.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - 'Attachment URLs are bearer links: anyone who knows one can download the file without logging in, even if the topic denies anonymous access. Encrypt sensitive attachments before uploading and protect logs containing those links.'
  - Messages, attachments, accounts, tokens, and bcrypt bootstrap hashes remain on the server without end-to-end encryption. Protect the data volume and encrypt off-server backups.
  - The NTFY_AUTH_USERS entry is declarative and overrides stored administrator credentials at startup. Keep it private and consistent during recovery; changing only a saved plaintext password does not rotate this hash.
  - Give automations regular users with explicit topic ACLs instead of administrator tokens. A leaked token inherits its owner's permissions; topic names are not passwords.
  - Cached messages and attachments expire after seven days. Backup restores original timestamps, not a new retention period. Proxy requests share one rate limit while forwarded-IP trust is disabled.
  assessment:
    status: warnings
    assessed_at: '2026-10-24'
