tagline: Уведомления от скриптов и устройств по темам
summary: ntfy передаёт сообщения от скриптов, мониторинга и домашних сценариев подписанным браузерам
  и мобильным клиентам. Рецепт требует вход, запрещает анонимный доступ к темам, хранит сообщения
  и вложения локально и создаёт администратора из закрытой bcrypt-записи.
categories:
- Уведомления
license_notes: Upstream использует двойную лицензию Apache-2.0/GPLv2; выберите применимый вариант.
  У рецепта отдельная лицензия MIT. Сторонние ресурсы клиентов сохраняют исходные условия.
license_restrictions: []
security_known_risks:
- 'URL вложения — ссылка доступа: знающий её скачает файл без входа, даже если анонимный доступ
  к теме запрещён. Шифруйте чувствительные вложения до загрузки и защищайте журналы с такими
  ссылками.'
- Сообщения, вложения, аккаунты, токены и начальные bcrypt-хэши хранятся на сервере без сквозного
  шифрования. Защищайте том данных и шифруйте внешние резервные копии.
- Запись NTFY_AUTH_USERS декларативная и при запуске перекрывает сохранённый пароль администратора.
  Храните её закрытой и согласованной при восстановлении; смена только сохранённого открытого
  пароля не меняет хэш.
- Для автоматизаций создавайте обычных пользователей с явными ACL тем вместо администраторских
  токенов. Утёкший токен получает права владельца; имя темы не является паролем.
- Кэш сообщений и вложения истекают через семь дней. Backup возвращает исходные сроки, не начинает
  хранение заново. Пока доверие forwarded-IP выключено, запросы через прокси делят один лимит.
smoke_test_limitations:
- На amd64 проверены живая HTTP-доставка, закрытое анонимное чтение/отправка и регистрация,
  точные байты вложения, обычный аккаунт, права токена через ACL тем, подписки/настройки и восстановление
  после удаления тома; arm64 не проверялась.
- URL вложений — ссылки доступа, скачиваемые без входа знающим URL. Тест подтверждает это поведение,
  но не приватность или сквозное шифрование вложений.
- Browser Web Push, фоновая доставка Android/iOS, Firebase, upstream-polling, SMTP, звонки,
  внешние интеграции, TLS-прокси и длительное хранение/истечение сроков не проверялись.
