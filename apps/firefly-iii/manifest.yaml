  tested_at: '2026-10-29'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-29'
    application_version: 6.7.9
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - The full application and volume-loss recovery scenario ran on amd64; arm64 was not tested.
  - The test registers and signs in the owner, creates a personal API token, account, transaction, category,
    tag and encrypted attachment, then verifies them after deleting all three volumes and restoring the archive.
    Public registration closes after the first account.
  - The cron endpoint is checked once; overnight scheduling, recurring-transaction timing, bank connections,
    Data Importer, email, TOTP and third-party mobile clients are not exercised.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The first visitor can claim an empty installation. Create the owner account over loopback or an SSH tunnel
    before exposing it to the LAN or a reverse proxy; registration then closes in the default single-user mode.
  - Financial records, attachment encryption keys, OAuth credentials and deployment secrets are included in
    backups. Encrypt external copies and restrict access to the volumes and .env.
  - Firefly III automatically migrates the database at startup. A downgrade requires restoring a compatible
    pre-upgrade database and storage archive, not merely selecting an older image.
  - Keep AUTHENTICATION_GUARD=web. The optional remote-user guard trusts the identity header without validation
    and requires an authenticating proxy that strips client-supplied headers.
  - Trivy found 8 CRITICAL package findings across the pinned application, PostgreSQL and Alpine helper images;
    functional verification does not resolve these findings.
  - SMTP, automatic bank connections and the separate Data Importer are not configured. MAIL_MAILER=log can
    write password-reset links to application logs; protect those logs.
  assessment:
    status: warnings
    assessed_at: '2026-10-29'
