tagline: Счета, операции и бюджеты на своём сервере
summary: Firefly III учитывает доходы, расходы, переводы и вложения, распределяет траты по категориям и бюджетам,
  отслеживает подписки и цели накопления. Рецепт запускает веб-приложение с PostgreSQL и ежедневной задачей
  cron; банковские подключения и отдельный Data Importer не входят в установку.
categories:
- Личные финансы
license_notes: Приложение и исходный логотип распространяются по AGPL-3.0-or-later, рецепт установки — по MIT.
  Источник и авторские права логотипа указаны в assets/NOTICE.
license_restrictions: []
security_known_risks:
- Первый посетитель может присвоить пустую установку. Создайте владельца через loopback или SSH-туннель до
  открытия доступа из сети и через прокси; после этого регистрация закрывается в стандартном однопользовательском
  режиме.
- Архивы включают финансовые записи, ключи шифрования вложений, учётные данные OAuth и секреты установки. Шифруйте
  внешние копии и ограничьте доступ к томам и .env.
- Firefly III автоматически мигрирует базу при запуске. Для понижения версии требуется восстановить совместимый
  архив базы и хранилища до обновления, а не просто выбрать старый образ.
- Сохраняйте AUTHENTICATION_GUARD=web. Дополнительный remote-user guard доверяет заголовку личности без проверки
  и требует аутентифицирующего прокси, который удаляет подставленные клиентом заголовки.
- Trivy обнаружил 8 CRITICAL-находок в пакетах закреплённых образов приложения, PostgreSQL и помощника Alpine;
  функциональная проверка их не устраняет.
- SMTP, автоматические банковские подключения и отдельный Data Importer не настроены. MAIL_MAILER=log может
  записывать ссылки сброса пароля в журнал приложения; защищайте журналы.
smoke_test_limitations:
- Полная проверка приложения и восстановления после удаления томов выполнялась на amd64; arm64 не проверялась.
- Тест регистрирует владельца, проверяет вход, создаёт персональный API-токен, счёт, операцию, категорию, тег
  и зашифрованное вложение, затем проверяет их после удаления всех трёх томов и восстановления архива. После
  первого аккаунта публичная регистрация закрывается.
- Endpoint cron вызывается один раз; ночное расписание, сроки повторяющихся операций, банковские подключения,
  Data Importer, почта, TOTP и сторонние мобильные клиенты не проверяются.
