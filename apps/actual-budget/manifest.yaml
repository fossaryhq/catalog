security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Until the server password is set in the browser, anyone who reaches the address can claim the instance; bootstrap it immediately after the first start.
    - Budget files are stored unencrypted unless end-to-end encryption is enabled per budget inside the application, and they land unencrypted in every backup.
    - ACTUAL_ALLOWED_LOGIN_METHODS is narrowed to password on purpose; allowing the header method behind a proxy that does not strip the header would let a request authenticate itself.
    - The whole budget is a handful of SQLite files in one volume, so anyone with access to the volume or an archive reads every transaction.
  assessment:
    status: not_assessed
    assessed_at: null

