schema_version: 6
publication_status: published

slug: actual-budget
name: Actual Budget
tagline: Envelope budgeting that syncs between your own devices
summary: >-
  Actual Budget assigns every rouble or dollar to a category for the month
  ahead, imports transactions from files or bank integrations, and keeps a full
  local copy of the budget in each browser and desktop client. The server in
  this recipe is the sync endpoint that merges those copies and stores the file
  in SQLite.

