tagline: Конвертный бюджет с синхронизацией между своими устройствами
summary: >-
  Actual Budget распределяет каждый рубль по категориям на месяц вперёд,
  импортирует операции из файлов и банковских интеграций и держит полную
  локальную копию бюджета в каждом браузере и настольном клиенте. Сервер из
  этого рецепта — точка синхронизации: он сводит копии и хранит файл бюджета в
  SQLite.
categories:
  - Личные финансы
license_notes: null
security_known_risks:
  - Пока пароль сервера не задан в браузере, инстанс достаётся любому, кто откроет адрес; задавайте пароль сразу после первого запуска.
  - Файлы бюджета хранятся без шифрования, пока для конкретного бюджета не включено сквозное шифрование внутри приложения, и в резервные копии попадают в открытом виде.
  - "ACTUAL_ALLOWED_LOGIN_METHODS намеренно сужен до password: вход по заголовку за прокси, который этот заголовок не вырезает, позволил бы запросу аутентифицировать самого себя."
  - Весь бюджет — это несколько файлов SQLite в одном volume, поэтому доступ к volume или к архиву означает доступ ко всем операциям.
license_restrictions: []
smoke_test_limitations:
  - Полный прикладной smoke-тест прошёл на amd64 и arm64.
  - Практическая проверка backup и restore прошла на amd64; на arm64 восстановление не проверялось.
  - Синхронизация бюджета между клиентами, сквозное шифрование и банковские интеграции smoke-тестом не проверяются.
