recipe:
  id: audiobookshelf-compose
  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: '>=2.24.0'
  application_version: 2.37.2
  images:
  - name: ghcr.io/advplyr/audiobookshelf
    tag_source: env
  - name: alpine
    tag_source: pinned
  tested_at: '2026-10-25'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-25'
    application_version: 2.37.2
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - On amd64, verifies native initialization and password validation/idempotence, login, anonymous denial,
    a restricted regular account, scanned original audio, authenticated HTTP range playback, progress,
    bookmark and collection. Deletes the volume and restores real audio bytes, accounts, signing identity
    and listening state; rejects database-only archives and preserves stopped-state backup. ARM64 was
    not tested.
  - The media fixture is a short original generated sample. Large libraries, transcoding under load, external
    podcast downloads, metadata providers, e-books, RSS sharing, OIDC, mobile clients and TLS proxies
    were not exercised.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - Before enabling any public proxy, run the bootstrap tools service from loopback. The native first-user
    setup is unauthenticated until initialization. AUDIOBOOKSHELF_ADMIN_PASSWORD initializes admin only
    on a new database and never rotates existing or restored passwords.
  - The data volume contains private media, account credentials, JWT signing material, progress, bookmarks
    and podcast/integration details. Encrypt backups and retain the entire volume, not only the SQLite
    database. RSS sharing feeds and download links can grant access to their holders; sharing is not enabled
    by this recipe.
  - Grant normal users only the required libraries and permissions; root accounts can administer all content.
    Local login has no native two-factor authentication. OIDC exists upstream but is not configured or
    tested here.
  - All books and podcast downloads must stay under /data/audiobooks and /data/podcasts to be covered
    by this backup. External mounts are not included. Host only material you are allowed to store and
    share. This recipe provides no hosted catalog or DRM removal.
  assessment:
    status: warnings
    assessed_at: '2026-10-25'
