slug: audiobookshelf
name: Audiobookshelf
tagline: Your audiobooks, podcasts and listening progress
summary: Audiobookshelf streams your own audiobook and podcast files, tracks listening progress, bookmarks
  and collections, and gives each account access to selected libraries. This recipe initializes a private
  administrator through the native API and backs up the database together with the actual media.
status: active
editorial_status: experimental
