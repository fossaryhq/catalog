tagline: Аудиокниги, подкасты и прогресс прослушивания
summary: Audiobookshelf воспроизводит ваши аудиокниги и подкасты, сохраняет прогресс, закладки и коллекции
  и ограничивает доступ пользователей отдельными библиотеками. Рецепт создаёт закрытого администратора
  через штатный API и резервирует базу вместе с настоящими медиафайлами.
categories:
- Медиасерверы
license_restrictions: []
license_notes: 'Audiobookshelf использует GPLv3: при распространении изменённых бинарных файлов соблюдайте
  требования лицензии и предоставления исходников. Рецепт — MIT. Для размещения медиа нужны соответствующие
  права; сервер не предоставляет каталог аудиокниг.'
security_known_risks:
- Перед включением публичного прокси запустите bootstrap с локального адреса. До инициализации первый
  аккаунт создаётся без авторизации. AUDIOBOOKSHELF_ADMIN_PASSWORD создаёт admin только в новой базе и
  не меняет существующие или восстановленные пароли.
- Том содержит личные медиа, данные аккаунтов, ключ подписи JWT, прогресс, закладки и настройки подкастов/интеграций.
  Шифруйте backup и сохраняйте том целиком, а не только SQLite. RSS-ленты общего доступа и ссылки на скачивание
  могут дать доступ их обладателям; рецепт общий доступ не включает.
- Обычным пользователям выдавайте только нужные библиотеки и права; root управляет всеми данными. Локальный
  вход не поддерживает штатную двухфакторную аутентификацию. OIDC есть в upstream, но здесь не настроен
  и не проверен.
- Чтобы backup включал книги и скачанные подкасты, храните их в /data/audiobooks и /data/podcasts. Внешние
  каталоги в архив не входят. Размещайте только разрешённые материалы. Рецепт не предоставляет коммерческий
  каталог и не снимает DRM.
smoke_test_limitations:
- На amd64 проверены штатная инициализация, проверка пароля и повторный bootstrap, вход, отказ анониму,
  обычный пользователь с ограниченной библиотекой, сканирование авторского аудио, HTTP range, прогресс,
  закладка и коллекция. После удаления тома восстановлены аудиобайты, аккаунты, ключ подписи и состояние
  прослушивания; неполный архив отклонён, backup сохраняет остановленное состояние. ARM64 не проверен.
- Медиафикстура — короткий авторский синтезированный образец. Большие библиотеки, транскодирование под
  нагрузкой, внешние подкасты, провайдеры метаданных, электронные книги, RSS-доступ, OIDC, мобильные клиенты
  и TLS-прокси не проверены.
