tagline: Лёгкий Git-сервис для репозиториев, задач и совместной разработки
summary: >-
  Gitea размещает Git-репозитории, pull request, задачи, wiki и реестры пакетов на собственном сервере. Рецепт использует официальный образ, PostgreSQL, отключает открытую регистрацию и привязывает web и SSH к localhost.
categories:
  - Разработка
license_notes: null
security_known_risks:
  - Git-сервис хранит исходный код, SSH-ключи, токены и webhooks; публичный web-доступ требует HTTPS, своевременных обновлений и защиты учётных записей.
  - Публичный SSH увеличивает поверхность атаки и в рецепте привязан к localhost; открывайте его осознанно и ограничивайте firewall.
  - "Gitea Actions и runner не настроены: выполнение недоверенных workflow требует отдельной модели изоляции."
license_restrictions: []
smoke_test_limitations:
  - Smoke-тест приложения прошёл на amd64 2026-10-09. arm64 в этом прогоне не проверялись.
  - Backup и restore не проходили практическую проверку восстановления.
screenshot_alts:
  - Панель после входа с календарём активности, лентой последних отправок, задач и релиза и списком репозиториев рядом
  - Страница репозитория в тёмной теме со списком файлов и последним коммитом по каждому, панелью описания, лицензией, последним выпуском и разбивкой по языкам
  - Список задач с пятью открытыми и одной закрытой, у каждой цветная метка, веха и автор
  - Запрос на слияние в тёмной теме с восемью добавленными строками правила алерта, подсвеченными в диффе, и панелью рецензирования сверху
  - История коммитов ветки main с автором, коротким хешем, сообщением, тегом релиза и датой каждого коммита
