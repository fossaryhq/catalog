tagline: Лёгкий Git-сервис для репозиториев, задач и совместной разработки
summary: >-
  Gitea размещает Git-репозитории, pull request, задачи, wiki и реестры пакетов
  на собственном сервере. Рецепт использует официальный образ, PostgreSQL,
  отключает открытую регистрацию и привязывает web и SSH к localhost.
categories:
  - Разработка
license_notes: null
security_known_risks:
  - Git-сервис хранит исходный код, SSH-ключи, токены и webhooks; публичный web-доступ требует HTTPS, своевременных обновлений и защиты учётных записей.
  - Публичный SSH увеличивает поверхность атаки и в рецепте привязан к localhost; открывайте его осознанно и ограничивайте firewall.
  - "Gitea Actions и runner не настроены: выполнение недоверенных workflow требует отдельной модели изоляции."
license_restrictions: []
smoke_test_limitations:
  - Полный smoke-тест прошёл на amd64 и arm64; backup и restore не проходили практическую проверку восстановления.
