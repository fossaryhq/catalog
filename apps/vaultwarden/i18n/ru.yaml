tagline: Лёгкий сервер менеджера паролей, совместимый с Bitwarden
summary: >-
  Vaultwarden хранит пароли, защищённые заметки, вложения и общие коллекции на
  вашем сервере и работает с официальными клиентами Bitwarden. Для небольшого
  инстанса достаточно одного контейнера и локального Docker volume с SQLite.
categories:
  - Менеджеры паролей
license_notes: >-
  Vaultwarden не связан с Bitwarden, Inc.; ошибки совместимости следует
  сообщать проекту Vaultwarden, а не в официальную поддержку Bitwarden.
security_known_risks:
  - Хранилище паролей является критичной целью; публичный доступ допустим только через HTTPS, а резервные копии следует шифровать.
  - Регистрация и приглашения выключены по умолчанию; временное включение регистрации нужно отменить сразу после создания учётной записи.
  - Панель /admin выключена; при её включении нужен хешированный Argon2id-токен и дополнительное ограничение доступа на reverse proxy.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke и восстановление пройдены на amd64; ARM64 и ARMv7 пока не проверены.
screenshot_alts:
  - Хранилище Vaultwarden со списком записей в тёмной теме
  - Просмотр записи с именем пользователя, паролем и адресом сайта в светлой теме
  - Генератор паролей с настройками длины и набора символов
  - Настройки двухфакторного входа с приложением-аутентификатором, passkey и Duo
  - Панель администрирования с версиями, базой данных и результатами проверок инстанса
