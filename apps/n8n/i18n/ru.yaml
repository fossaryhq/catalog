tagline: Конструктор автоматизаций и интеграций на своём сервере
summary: >-
  n8n соединяет сервисы между собой без программирования: рабочий процесс
  собирается из узлов на холсте, запускается по расписанию, вебхуку или событию
  и умеет ветвиться, повторять шаги и обрабатывать ошибки. Больше пятисот
  готовых интеграций, узел с произвольным кодом на JavaScript и Python, работа
  с LLM. Данные и учётные записи остаются на вашем сервере.
categories:
  - Автоматизация
license_notes: >-
  n8n распространяется под Sustainable Use License 1.0 — это fair-code, а не
  открытая лицензия в смысле OSI. Для личного и внутрикорпоративного
  использования, включая коммерческое, платить не нужно; ограничения касаются
  перепродажи n8n как сервиса. Часть корпоративных функций закрыта отдельной
  лицензией и в этом рецепте недоступна.
security_known_risks:
  - "n8n хранит учётные данные всех подключённых сервисов; база вместе с N8N_ENCRYPTION_KEY достаточна для их расшифровки, поэтому ключ и дампы нужно защищать как пароли."
  - "Узел Code выполняет произвольный JavaScript и Python внутри контейнера n8n: официальный sandbox-исполнитель требует privileged Docker-in-Docker и в рецепт намеренно не включён."
  - "Вебхуки и редактор доступны на одном порту, поэтому публикация вебхуков в интернет открывает и панель управления: обязательны HTTPS и стойкий пароль владельца."
  - Установка community-узлов подтягивает npm-пакеты внутрь инстанса и выполняет их код с правами n8n.
license_restrictions:
  - "Нельзя предоставлять n8n третьим лицам как размещённый или управляемый сервис: собственный инстанс разрешён только для своей организации и её задач."
  - "Нельзя убирать и менять упоминания лицензии, авторства и товарные знаки n8n."
  - "Файлы с .ee. в имени и каталоги .ee под Sustainable Use License не подпадают и требуют коммерческой лицензии n8n Enterprise."
smoke_test_limitations:
  - "Изолированный запуск ещё не выполнялся ни на одной архитектуре, поэтому опубликованный рецепт пока не проверен."
  - Внешний sandbox-исполнитель кода и очередь на Redis в рецепт не входят и не проверялись.
screenshot_alts:
  - Холст n8n с рабочим процессом из нескольких соединённых узлов в тёмной теме
  - История запусков со статусом, длительностью и режимом каждого выполнения в светлой теме
  - Список сохранённых учётных данных к внешним сервисам в тёмной теме
  - Панель узла Code с кодом обработки и предпросмотром входных и выходных данных в светлой теме
