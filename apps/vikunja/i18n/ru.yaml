tagline: Задачи, проекты и канбан на своём сервере
summary: Vikunja хранит задачи, проектные доски, сроки и вложения на вашем
  сервере. Планируйте домашние дела и небольшие командные проекты в списках или
  канбане, с повторяющимися задачами и встроенной двухфакторной аутентификацией.
  Этот рецепт использует официальный образ и отдельную PostgreSQL.
categories:
  - Управление задачами
license_notes: Сервер распространяется под AGPL-3.0-or-later. Дополнительные
  функции Pro требуют отдельной лицензии; рецепт использует бесплатное ядро.
  Настольная оболочка отдельно лицензирована под GPL-3.0-or-later.
license_restrictions: []
security_known_risks:
  - Задачи, комментарии, аккаунты и вложения содержат личные данные; защищайте
    оба тома и шифруйте копии вне сервера.
  - Сохраняйте секрет сервиса и реквизиты БД с резервной копией; защищайте .env
    и не меняйте пароли инициализированной базы одной правкой .env.
  - Ссылки общего доступа могут открыть проект людям без аккаунта; проверяйте их
    права и передавайте только нужным читателям.
smoke_test_limitations:
  - Проверки здоровья, входа, задач и канбана, вложения, backup и restore
    выполнены на amd64; arm64 не проверялась.
  - Smoke-тест не проверяет SMTP, OIDC, подключение MFA, настольные клиенты и
    интеграцию с обратным прокси.
  - Расписания повторяющихся задач и почтовые напоминания не проверялись.
screenshot_alts:
  - Канбан Vikunja с домашними задачами, сгруппированными по этапу выполнения
  - Список задач Vikunja со сроками, приоритетами и метками в тёмной теме
  - Карточка задачи Vikunja с шагами восстановления, исполнителем, метками и
    вложением
