tagline: Браузерные инструменты для повседневной разработки
summary: IT Tools объединяет кодирование текста, вычисление хешей и преобразование форматов в одном локальном
  веб-интерфейсе. Статический рецепт запускает фиксированную upstream-сборку без root и базы приложения;
  серверный backup не включает избранное и данные инструментов из браузера.
categories:
- Разработка
license_restrictions: []
license_notes: IT Tools использует GPLv3. При распространении изменённой сборки сохраняйте лицензию и
  выполняйте требования предоставления соответствующих исходников. Рецепт и авторские примеры — MIT; экономия
  на коммерческом сервисе не заявляется.
security_known_risks:
- У статического приложения нет аккаунтов, штатных OIDC, MFA и разграничения доступа. Пользоваться может
  любой посетитель. Оставьте рецепт на loopback; при необходимости используйте личный VPN или отдельно
  защищённый HTTPS-шлюз.
- 'Некоторые значения и избранное сохраняются в local storage браузера. Очистка сайта или потеря профиля
  удаляет их; серверный backup их не восстановит. Не вставляйте рабочие ключи или недоверенный активный
  контент в случайные сессии: расширения и общий профиль браузера могут видеть ввод.'
- Последний стабильный upstream-образ датирован 2024-10-22; проверено 2026-10-25. Работоспособность не
  доказывает актуальность зависимостей или регулярность сопровождения. Сканирование уязвимостей не заявляется.
- Проверенные кодирование, хеширование и преобразования выполняются в браузере без запросов на сторонние
  origin. Это наблюдение для выбранных инструментов, а не гарантия всех функций, внешних ссылок и будущих
  образов. VITE-настройки применяются при сборке; runtime env не пересобирает официальный образ.
smoke_test_limitations:
- На amd64 проверены non-root/read-only сервер, SPA-маршруты, штатный браузерный Base64 Unicode в обе
  стороны, SHA-256, JSON → YAML и отказ неверному вводу без внешних запросов этих инструментов. Чистая
  установка восстанавливает контрольный заголовок Nginx; неполный архив отклоняется до изменения данных,
  backup сохраняет остановленное состояние. ARM64 не проверен.
- Backup содержит только настройки сервера, env и Compose. Избранное, предпочтения и сохраняемый ввод
  принадлежат браузеру и сервером не восстанавливаются. Другие инструменты, внешние ссылки, TLS-прокси,
  шлюзы входа и уязвимости зависимостей не проверены.
