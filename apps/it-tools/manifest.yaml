    application_version: 2024.10.22-7ca5933
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - On amd64, verifies non-root/read-only serving, SPA routes, native browser Unicode Base64 roundtrip,
    SHA-256, JSON-to-YAML and invalid-input validation without off-origin requests for those tools. Recreates
    a clean deployment, restores a custom Nginx configuration marker, rejects incomplete archives before
    mutation, and preserves stopped-state backup. ARM64 was not tested.
  - Backups cover server configuration, environment and Compose only. Favorites, preferences and any persisted
    tool inputs belong to browser storage and are not server-restored. Other tools, external links, TLS
    proxies, authentication gateways and dependency vulnerabilities were not exercised or scanned.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - This static application has no accounts, native OIDC, MFA or authorization. Anyone who can reach it
    can use it. Keep the recipe on loopback; use a private VPN or an independently protected HTTPS gateway
    if needed.
  - Some tool values and favorites persist in browser local storage; clearing the site or losing the browser
    profile loses them. Server backups cannot recover browser data. Do not paste production keys or untrusted
    active content into casual utility sessions; browser extensions and shared profiles can observe your
    input.
  - The latest stable upstream image is dated 2024-10-22, verified on 2026-10-25. A successful smoke does
    not establish current dependency security or ongoing release maintenance. No vulnerability scan is
    claimed.
  - The tested encoders, hashing and format conversions run in the browser without off-origin requests.
    This is a scoped observation, not a guarantee for every tool, external link or future image. Frontend
    VITE settings are build-time; runtime environment variables do not rebuild the official image.
  assessment:
    status: warnings
    assessed_at: '2026-10-25'
