tagline: Метрики и история домашних серверов
summary: Beszel собирает показатели CPU, памяти, дисков и сети через лёгкие агенты и хранит историю в
  локальной панели. Рецепт центрального сервера создаёт закрытого администратора при первом запуске, отключает
  самостоятельную регистрацию и сохраняет аккаунты, метрики и SSH-ключ в одном резервируемом томе.
categories:
- Мониторинг
license_restrictions: []
license_notes: Beszel и рецепт используют MIT. При распространении кода или логотипа сохраняйте соответствующие
  уведомления об авторских правах и разрешениях.
security_known_risks:
- Панель хранит чувствительный состав инфраструктуры, метрики, закрытый SSH-ключ и токены интеграций.
  Защитите том и шифруйте внешние backup. Восстановление ключа возвращает доверие существующих агентов.
- BESZEL_ADMIN_EMAIL и BESZEL_ADMIN_PASSWORD создают администратора приложения и суперпользователя PocketBase
  только в новой базе. Они не меняют пароль существующей или восстановленной базы. Ограничьте доступ к
  административному интерфейсу /_/.
- По умолчанию пользователь видит назначенные ему системы; администратор и суперпользователь имеют широкие
  права. Выдавайте минимальные роли и не включайте SHARE_ALL_SYSTEMS без необходимости.
- Вход по доверенному заголовку, AUTO_LOGIN, OIDC, MFA по email-OTP и создание OAuth-пользователей рецептом
  не включены. При настройке forwarded login ограничьте IP доверенных прокси и исключите прямой доступ
  к панели.
- Рецепт устанавливает только центральный сервер. Агенты раскрывают сведения о системах и получают дополнительные
  права через host network, устройства или Docker socket; проверяйте каждую установку отдельно. Тестовый
  агент этих интеграций не имеет.
smoke_test_limitations:
- На amd64 проверены начальный вход, закрытие первой/публичной регистрации, изоляция анонимных данных,
  настоящие метрики отдельного sandbox-агента, восстановление после удаления тома, старая история/настройки/SSH-ключ,
  отказ неполному архиву и backup остановленного сервиса. ARM64 не проверен.
- Тестовый агент работает в изолированной Docker-сети без host networking, каталогов хоста и Docker socket.
  Показатели относятся к этому окружению и ядру; полное наблюдение физического хоста, контейнеров, GPU,
  SMART, ZFS и systemd не проверено.
- OIDC, MFA email-OTP, доверенный заголовок, доставка email/push, внешние сетевые проверки, сторонние
  клиенты, TLS-прокси и длительное хранение не проверены. Агенты реальных систем подключаются отдельно.
