  - tested_at: '2026-10-24'
    application_version: 0.21.1
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - On amd64, the smoke verifies bootstrap login, closed first-user/public registration, anonymous data
    isolation, real metrics from a separate pinned sandbox agent, recovery after deleting the hub volume,
    restored historical measurements/settings/SSH key, rejected incomplete backups, and stopped-state
    backup. ARM64 was not tested.
  - The test agent runs in an isolated Docker network without host networking, host mounts or Docker socket.
    Its readings describe that sandbox/kernel environment; the test does not establish complete physical-host,
    container, GPU, SMART, ZFS or systemd monitoring.
  - OIDC, email-OTP MFA, trusted-header login, email/push delivery, external network checks, native third-party
    clients, TLS proxies and long-term retention were not exercised. Agents on your real systems require
    separate onboarding.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The hub stores sensitive infrastructure inventory, metrics, SSH private identity and integration tokens.
    Protect the data volume and encrypt off-server backups. A restored hub key restores trust with existing
    agents.
  - BESZEL_ADMIN_EMAIL and BESZEL_ADMIN_PASSWORD bootstrap both the application administrator and PocketBase
    superuser on a new database only. They do not rotate credentials in an existing or restored database.
    Restrict access to the /_/ administration interface.
  - Only systems assigned to a user are shared by default; administrator/superuser access is powerful.
    Grant accounts the minimum role and do not enable SHARE_ALL_SYSTEMS casually.
  - Trusted-header login, AUTO_LOGIN, OIDC, email-OTP MFA and new OAuth user creation are not enabled
    by this recipe. If enabling forwarded login later, restrict trusted proxy IPs and prevent direct access
    to the hub.
  - This recipe installs the hub only. Agents can expose host inventory and gain additional privileges
    through host networking, device mounts or Docker socket access; review and restrict each agent deployment
    separately. The test agent has none of those integrations.
  assessment:
    status: warnings
    assessed_at: '2026-10-24'
