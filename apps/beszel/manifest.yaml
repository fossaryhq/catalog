slug: beszel
name: Beszel
tagline: Lightweight server metrics and history
summary: Beszel collects server CPU, memory, storage and network metrics through lightweight agents and
  keeps their history in a local dashboard. This hub recipe creates a private administrator on first start,
  closes self-registration, and preserves accounts, monitoring history and SSH identity in one backed-up
  volume.
