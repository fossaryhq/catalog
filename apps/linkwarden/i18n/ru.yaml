tagline: Закладки и веб-архивы на собственном сервере
summary: >-
  Linkwarden сохраняет, группирует и ищет закладки, создаёт локальные копии
  страниц и позволяет делиться коллекциями. Рецепт включает PostgreSQL 16,
  Meilisearch 1.13.3, отдельный origin для сохранённого HTML и безопасную
  привязку web-порта к localhost.
categories:
  - Закладки и архивирование
license_notes: null
security_known_risks:
  - Headless browser получает недоверенные URL и обрабатывает активный контент; ошибки upstream или сетевой политики могут привести к SSRF и исчерпанию CPU, RAM либо диска.
  - Сохранённый HTML может содержать активный контент; его нужно обслуживать с отдельного origin, не разделяющего cookies с основным приложением.
  - ALLOW_PRIVATE_NETWORK_ACCESS и ALLOW_INSECURE_TLS закреплены в false; их включение позволяет обращаться к внутренним сервисам или принимать недействительные TLS-сертификаты.
  - Открытая регистрация нужна только для первой учётной записи и должна быть выключена сразу после её создания.
  - NEXTAUTH_SECRET, пароль PostgreSQL и ключ Meilisearch находятся в .env; файл и резервные копии нужно шифровать и хранить вне Git.
license_restrictions: []
smoke_test_limitations:
  - Полный HTTP smoke-тест прошёл на amd64; arm64 остаётся непроверенной из-за ограничений хоста WSL/QEMU.
  - Backup, restore, миграции PostgreSQL и восстановление индекса Meilisearch не проходили практическую проверку.
