tagline: Вики с книгами, главами и страницами
summary: >-
  BookStack организует общие знания в книги, главы и страницы. Ведите домашние
  инструкции, справочники команды и регламенты обслуживания в визуальном или
  Markdown-редакторе, с поиском, историей правок и правами доступа. Этот рецепт
  запускает образ сообщества LinuxServer с отдельной базой MariaDB.
categories:
  - Управление знаниями
license_notes: null
license_restrictions: []
security_known_risks:
  - Начальные данные admin@admin.com / password общеизвестны; замените эту учётную запись через loopback до публикации сервиса.
  - Сохраняйте APP_KEY вместе с базой и загрузками; потеря или смена ключа может сделать зашифрованные данные приложения недоступными, включая секреты MFA.
  - Документы, вложения, аккаунты и реквизиты доступа содержат личные данные; шифруйте резервные копии и храните экземпляр вне сервера.
  - Рецепт использует сторонний образ LinuxServer; сам BookStack этот контейнерный образ не выпускает.
smoke_test_limitations:
  - Проверки здоровья, входа, копирования и восстановления базы и файлов выполнены на amd64; arm64 не проверялась.
  - Smoke-тест не проверяет email, OIDC, SAML, MFA и интеграцию с обратным прокси.
screenshot_alts:
  - Библиотека BookStack со справочниками по домашнему серверу, быту и проектам
  - Руководство BookStack по обслуживанию сервера, разделённое на главы и страницы
  - Инструкция BookStack по резервному копированию с чек-листом и восстановлением в тёмной теме
