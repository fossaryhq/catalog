schema_version: 6
publication_status: published

slug: paperless-ngx
name: Paperless-ngx
tagline: Search, OCR, and organize documents on your own server
summary: >-
  Paperless-ngx ingests scans and PDFs, runs OCR over them, extracts metadata,
  and turns a document archive into a searchable full-text database.
  This recipe uses PostgreSQL and Valkey, keeps originals locally, and exposes
  the web interface on localhost only.

status: active
editorial_status: experimental

links:
  website: https://docs.paperless-ngx.com/
  source: https://github.com/paperless-ngx/paperless-ngx
  documentation: https://docs.paperless-ngx.com/
  issues: https://github.com/paperless-ngx/paperless-ngx/issues

