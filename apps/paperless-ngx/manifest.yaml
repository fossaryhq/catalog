recipe:
  id: paperless-ngx-compose
  version: 2
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: 3.1.2
  images:
    - name: paperlessngx/paperless-ngx
      tag_source: pinned
    - name: postgres
      tag_source: pinned
    - name: valkey/valkey
      tag_source: pinned
  tested_at: "2026-09-11"
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-09-11"
      application_version: 3.1.2
      recipe_version: 2
      tested_architectures:
        amd64: passed
        arm64: not_tested
      smoke_test: full
      restore_tested: true
    - tested_at: "2026-09-03"
      application_version: 3.1.2
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
      smoke_test: full
      restore_tested: false
  license: MIT
  smoke_test_limitations:
    - The full smoke test, including the document_exporter and document_importer round trip, passed on amd64; arm64 remains untested because of WSL/QEMU host limitations.
    - The restore was checked against the same Paperless-ngx version and the same PostgreSQL major; an import into another version and a PostgreSQL major upgrade are not covered.
    - The export omits API tokens, so every token has to be issued again after an import; the round trip confirms it.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Documents, thumbnails, and recognized text are not encrypted at rest; encrypt the server and backups when the archive contains sensitive data.
    - OCR and converters process untrusted PDFs and images; crafted files may exploit parsers or exhaust CPU, RAM, and disk.
    - A compromised account exposes the document archive; public access requires HTTPS, strong passwords, timely updates, and access restrictions.
    - Exports contain documents, users, and configuration but omit API tokens; protect them like source documents and issue new tokens after restore.
  assessment:
    status: not_assessed
    assessed_at: null

