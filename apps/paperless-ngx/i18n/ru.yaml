tagline: Поиск, OCR и порядок в документах на собственном сервере
summary: >-
  Paperless-ngx принимает сканы и PDF, прогоняет их через OCR, извлекает
  метаданные и превращает архив документов в полнотекстовую базу с поиском.
  Рецепт использует PostgreSQL и Valkey, хранит оригиналы локально и публикует
  web-интерфейс только через localhost.
categories:
  - Документы
license_notes: null
security_known_risks:
  - Документы, миниатюры и распознанный текст не шифруются на диске; шифруйте сервер и резервные копии, если архив содержит чувствительные данные.
  - OCR и конвертеры обрабатывают недоверенные PDF и изображения; специально созданные файлы могут использовать уязвимости парсеров или исчерпать CPU, RAM и диск.
  - Публичный архив раскрывает содержимое документов при компрометации учётной записи; обязательны HTTPS, стойкие пароли, своевременные обновления и ограничение доступа.
  - Export содержит документы, пользователей и конфигурацию, но не API tokens; архив нужно защищать как исходные документы, а токены после restore выпускать заново.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke-тест, включая круг document_exporter и document_importer, прошёл на amd64; arm64 остаётся непроверенной из-за ограничений хоста WSL/QEMU.
  - Restore проверен на той же версии Paperless-ngx и том же мажоре PostgreSQL; импорт в другую версию и мажорное обновление PostgreSQL не покрыты.
  - Export не содержит API tokens, поэтому после импорта их нужно выпускать заново; круг проверки это подтверждает.
