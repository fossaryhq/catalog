tagline: Синхронизация и общий доступ к файлам с быстрыми клиентами
summary: >-
  Seafile синхронизирует файлы блоками с дедупликацией, а не зеркалированием
  каталога, — за счёт этого большие коллекции и прерванные передачи идут быстро.
  Каждая библиотека синхронизируется отдельно с настольным клиентом, телефоном и
  браузером, открывается по ссылке или по учётной записи и может шифроваться на
  стороне клиента, чтобы сервер не видел содержимого.
categories:
  - Облачные хранилища
license_notes: >-
  Community Edition состоит из двух частей: ядро сервера под AGPLv3 с
  исключением для линковки с OpenSSL и web-интерфейс Seahub под Apache-2.0.
  Professional Edition добавляет SAML, расширенное администрирование и
  интеграцию с онлайн-офисом по платной лицензии и бесплатен до трёх
  пользователей; этот рецепт разворачивает только Community Edition.
security_known_risks:
  - В .env лежат пять секретов — пароль администратора, пароли root и роли MariaDB, пароль кеша и ключ JWT; резервные копии нужно шифровать отдельно.
  - SEAFILE_SERVER_HOSTNAME и SEAFILE_SERVER_PROTOCOL записываются в сгенерированную конфигурацию при первом старте, поэтому неверная схема будет и дальше давать небезопасные ссылки, пока файлы внутри volume не отредактированы.
  - Контейнер поднимает собственный nginx от root внутри образа, потому что NON_ROOT выключен, — так устроен официальный образ.
  - "Библиотеки без клиентского шифрования хранятся обычными блоками: доступ к volume или к архиву означает доступ ко всем файлам."
  - SAML, расширенное администрирование и онлайн-офис относятся к платной Professional Edition, поэтому установке, которой они нужны, этого рецепта не хватит.
license_restrictions: []
smoke_test_limitations:
  - Полный прикладной smoke-тест прошёл на amd64; стабильной сборки под ARM у образа нет.
  - Практическая проверка backup и restore прошла на amd64.
  - Синхронизация с настольными и мобильными клиентами, зашифрованные библиотеки, ссылки для общего доступа и вход через OAuth smoke-тестом не проверяются.
