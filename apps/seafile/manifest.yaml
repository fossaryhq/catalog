    amd64: passed
  smoke_test: full
  check_history:
    - tested_at: "2026-09-03"
      application_version: 13.0.25
      recipe_version: 1
      tested_architectures:
        amd64: passed
      smoke_test: full
      restore_tested: true
    - tested_at: "2026-09-02"
      application_version: 13.0.25
      recipe_version: 1
      tested_architectures:
        amd64: passed
      smoke_test: partial
      restore_tested: false
