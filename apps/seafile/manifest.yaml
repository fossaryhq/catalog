schema_version: 6
publication_status: published

slug: seafile
name: Seafile
tagline: Library-based file sync and sharing with fast desktop clients
summary: >-
  Seafile syncs files as deduplicated blocks rather than as a mirrored
  directory, which is what makes large collections and interrupted transfers
  fast. Each library syncs separately to desktop, mobile, and the browser, can
  be shared by link or account, and can be encrypted client-side so the server
  never sees its contents.

status: active
editorial_status: experimental

links:
  website: https://www.seafile.com/
  source: https://github.com/haiwen/seafile-server
  documentation: https://manual.seafile.com/13.0/
  issues: https://github.com/haiwen/seafile/issues

classification:
  categories:
    - Cloud storage
  tags:
    - files
    - sync
    - sharing
    - encryption
    - homelab
  implementation_languages:
    - C
    - Python
    - JavaScript
    - Go
  alternatives_to:
    - Dropbox
    - Google Drive
    - Яндекс Диск

license:
  spdx: AGPL-3.0-only AND Apache-2.0
  kind: open_source
  restrictions: []
  notes: >-
    The Community Edition is split: the server core is AGPLv3 with an OpenSSL
    linking exception, and Seahub, the web frontend, is Apache-2.0. The
    Professional Edition adds SAML, advanced administration, and online office
    integration under a paid licence and is free for up to three users; this
    recipe deploys the Community Edition only.

