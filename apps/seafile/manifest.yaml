  smoke_test_limitations:
    - The full application smoke test passed on amd64; the published image has no stable ARM build to test.
    - A practical backup and restore test passed on amd64.
    - Desktop and mobile synchronisation, client-side encrypted libraries, sharing links, and OAuth sign-in are not exercised by the smoke test.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Five secrets live in .env — the administrator password, the MariaDB root and role passwords, the cache password, and the JWT key; the same file also decrypts nothing, so archives must be encrypted separately.
    - SEAFILE_SERVER_HOSTNAME and SEAFILE_SERVER_PROTOCOL are written into the generated configuration at first start, so a wrong scheme keeps producing insecure links until the files inside the volume are edited.
    - The container runs its own nginx as root inside the image because NON_ROOT is false, which is what the upstream image expects.
    - Libraries that are not encrypted client-side are stored as plain blocks; anyone with access to the data volume or a backup reads every file.
    - SAML, advanced administration, and online office belong to the paid Professional Edition, so an installation that needs them cannot stay on this recipe.
  assessment:
    status: not_assessed
    assessed_at: null

