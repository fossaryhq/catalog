    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-24'
    application_version: v2.7.0
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - On amd64, the smoke checks native health, rejected anonymous API access and unexpected Host headers,
    failed and successful password login, service/bookmark content, recovery after removing configuration,
    rejection of an incomplete backup, and stopped-state backup. ARM64 was not exercised.
  - OIDC, external service integrations and credentials, Docker/Kubernetes discovery, reverse-proxy TLS,
    edge login rate limits, and long-term operation were not tested. Resource widgets describe the container,
    not the complete host.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The configured password grants access to the shared dashboard; Homepage has no per-user authorization
    in this recipe. OIDC exists upstream but is not configured or tested.
  - Homepage has no built-in password-attempt rate limit. Use a VPN/IP allowlist or an edge limit before
    exposing the login publicly; the Nginx sample includes a limit for credential callbacks.
  - The allowed-host list is not authentication or a firewall. Keep exact host:port entries and the external
    URL consistent; do not use a wildcard. Use HTTPS outside a trusted LAN.
  - Configuration, environment and backups can contain widget API keys, the login password and session
    secret. Protect them and encrypt off-server backups. Static assets and custom CSS remain public; never
    put secrets in them.
  - Widget URLs can make server-side requests to reachable systems. Only trusted operators should edit
    configuration; use least-privilege integration tokens. Docker socket and Kubernetes discovery are
    not connected by this recipe.
  assessment:
    status: warnings
    assessed_at: '2026-10-24'
