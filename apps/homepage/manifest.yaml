name: Homepage
tagline: A dashboard for your self-hosted services
summary: Homepage brings service links, bookmarks, and optional integration widgets into a configurable
  home dashboard. This recipe enables password login, restricts accepted hosts, runs as an unprivileged
  user, and keeps configuration on your server.
