  собственные условия.
license_restrictions: []
security_known_risks:
- Заданный пароль открывает общую панель; разграничения прав пользователей в рецепте нет. OIDC поддерживается
  upstream, но не настроен и не проверен.
- В Homepage нет встроенного ограничения попыток входа. Перед публичным доступом используйте VPN, список
  разрешённых IP или ограничение на внешнем прокси; пример Nginx ограничивает запросы к обработчику пароля.
- Список Host не заменяет аутентификацию или firewall. Согласуйте точные адреса host:port с внешним URL
  и не ставьте wildcard. Вне доверенной LAN нужен HTTPS.
- Конфигурация, окружение и backup могут содержать API-ключи виджетов, пароль и секрет сессий. Закройте
  доступ и шифруйте внешние копии. Статика и custom CSS доступны без входа; не помещайте туда секреты.
- URL виджетов позволяют серверу обращаться к доступным системам. Доверяйте редактирование только операторам
  и выдавайте интеграциям минимум прав. Docker socket и Kubernetes discovery в рецепте не подключены.
smoke_test_limitations:
- На amd64 проверены health, отказ анонимному API и чужому Host, неверный и верный пароль, сервисы и закладки,
  восстановление после удаления конфигурации, отказ неполному архиву и backup остановленного сервиса.
  ARM64 не проверен.
- OIDC, внешние интеграции и ключи, обнаружение Docker/Kubernetes, TLS прокси, внешнее ограничение попыток
  входа и длительная эксплуатация не проверены. Виджеты ресурсов показывают контейнер, а не весь хост.
