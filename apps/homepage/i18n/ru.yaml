tagline: Панель ваших домашних сервисов
summary: Homepage объединяет ссылки на сервисы, закладки и дополнительные виджеты интеграций в настраиваемой
  домашней панели. Рецепт включает вход по паролю, проверку Host, запуск без root и локальное хранение
  конфигурации.
categories:
- Панели сервисов
license_notes: В репозитории upstream находится лицензия GNU GPL версии 3. При распространении изменений
