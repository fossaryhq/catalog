    - AdGuard DNS
    - Cloudflare Gateway

license:
  spdx: GPL-3.0-only
  kind: open_source
  restrictions: []
  notes: >-
    AdGuard Home is fully free software and needs no AdGuard subscription. The
    company's paid products (AdGuard DNS, Premium browser extensions) are
    unrelated to this recipe.

