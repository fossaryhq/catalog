schema_version: 6
publication_status: published

slug: adguard-home
name: AdGuard Home
tagline: A DNS server that blocks ads and trackers for the whole network
summary: >-
  AdGuard Home replaces the router's DNS resolver and filters ads, trackers, and
  malicious domains for every device on the network at once, including TVs and
  phones where no blocker can be installed. One container, a web panel with
  statistics and a query log, plus DNS-over-HTTPS and DNS-over-TLS upstreams.

status: active
editorial_status: experimental

links:
  website: https://adguard.com/adguard-home/overview.html
  source: https://github.com/AdguardTeam/AdGuardHome
  documentation: https://adguard-dns.io/kb/adguard-home/
  issues: https://github.com/AdguardTeam/AdGuardHome/issues

