security:
  public_exposure: not_recommended
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Port 53 exposed to the internet turns the server into an open resolver used for DNS amplification; by default the recipe publishes DNS on 127.0.0.1 only.
    - The query log records the domains every device on the network visits; retention and client anonymization must be configured deliberately.
    - The built-in DHCP server needs host networking or macvlan, so it is not enabled in this recipe and will not work.
    - On Ubuntu and Debian port 53 is normally held by systemd-resolved, and reconfiguring it affects name resolution on the host itself.
  assessment:
    status: warnings
    assessed_at: "2026-08-31"

