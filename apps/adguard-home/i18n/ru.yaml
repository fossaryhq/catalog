tagline: DNS-сервер, который блокирует рекламу и трекеры для всей сети
summary: >-
  AdGuard Home заменяет DNS-резолвер роутера и фильтрует рекламу, трекеры и
  вредоносные домены сразу на всех устройствах сети, включая телевизоры и
  смартфоны без возможности установить блокировщик. Один контейнер, веб-панель
  со статистикой и журналом запросов, поддержка DNS-over-HTTPS и DNS-over-TLS.
categories:
  - Сеть
license_notes: >-
  AdGuard Home полностью свободен и не требует подписки AdGuard. Платные
  продукты компании (AdGuard DNS, браузерные расширения Premium) к этому
  рецепту отношения не имеют.
security_known_risks:
  - Порт 53, открытый в интернет, превращает сервер в open resolver и используется для DNS-амплификации; рецепт по умолчанию публикует DNS только на 127.0.0.1.
  - Журнал запросов хранит домены, которые посещают все устройства сети; срок хранения и анонимизацию клиентов нужно настроить осознанно.
  - Встроенный DHCP-сервер требует host network или macvlan, поэтому в рецепте он не включён и работать не будет.
  - На Ubuntu и Debian порт 53 обычно занят systemd-resolved; его перенастройка затрагивает разрешение имён на самом хосте.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 и ARMv7 пока не проверялись.
  - DHCP-сервер и DNS-over-HTTPS в рецепте не включены и не проверялись.
screenshot_alts:
  - Панель AdGuard Home со сводкой запросов, долей заблокированной рекламы и списком активных устройств в тёмной теме
  - Журнал запросов с доменами, клиентами и причиной блокировки в светлой теме
  - Список подключённых блок-листов с числом правил и датой обновления в тёмной теме
  - Настройки DNS с полями upstream-серверов и режимом их опроса в светлой теме
