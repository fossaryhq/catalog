    - TypeScript
  alternatives_to:
    - Adobe Acrobat
    - Smallpdf
    - iLovePDF

license:
  spdx: LicenseRef-Stirling-PDF-User-License
  kind: source_available
  restrictions:
    - The product as a whole is under a composite licence; the proprietary directories, and the other parts the root LICENSE lists, are governed by the Stirling PDF User License rather than MIT.
    - Without a subscription the User License permits internal evaluation or minimal use only, and forbids production, business-critical, client-facing, and commercial use, redistribution, and circumventing the licence restrictions.
    - Upstream also advertises a free plan for up to five users; whether that widens the User License wording for production is unclear, so obtain confirmation from the rights holder before such use.
  notes: >-
    Stirling PDF is open-core, not wholly MIT. The standard image includes parts
    under the Stirling PDF User License, which limits production, commercial,
    client-facing, and business-critical use without a subscription. Upstream
    also advertises a Free tier for up to five users, but how that statement
    modifies the narrower embedded licence is unclear; obtain confirmation from
    the rights holder before production use.

