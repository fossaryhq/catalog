  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: 2.14.3
  images:
    - name: stirlingtools/stirling-pdf
      tag_source: pinned
  tested_at: "2026-09-03"
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-09-03"
      application_version: 2.14.3
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
      smoke_test: full
      restore_tested: false
  license: MIT
  smoke_test_limitations:
    - The full application-level HTTP smoke test passed on amd64; arm64 remains untested because of WSL/QEMU host limitations.
    - Backup and restoration of H2 together with configuration, custom files, pipelines, and tessdata have not passed a practical restore test.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - PDF, image, and office documents reach complex native tools; crafted input may attack parsers or exhaust CPU, RAM, temporary space, and disk.
    - URL-to-PDF carries an SSRF risk and is explicitly disabled; do not enable it on a public instance without separate network isolation and review of upstream protections.
    - Embedded H2, accounts, and settings live under /configs; damage or an inconsistent copy can make users and configuration unavailable.
    - The initial password is stored in .env and applies only while the first database is created; protect the file and backups as secrets and change the password after first login.
    - Production rights and the advertised Free tier for up to five users are ambiguous; verify your use case with Stirling PDF Inc.
  assessment:
    status: not_assessed
    assessed_at: null

