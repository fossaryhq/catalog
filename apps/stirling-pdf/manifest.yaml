schema_version: 6
publication_status: published

slug: stirling-pdf
name: Stirling PDF
tagline: More than 60 PDF tools on your own server
summary: >-
  Stirling PDF combines editing, conversion, OCR, compression, signing, and
  automated PDF processing in one web interface. This recipe makes authentication
  mandatory, uses local H2, and binds to localhost, so documents never need to
  reach a cloud service.

status: active
editorial_status: experimental

links:
  website: https://stirling.com/
  source: https://github.com/Stirling-Tools/Stirling-PDF
  documentation: https://docs.stirlingpdf.com/
  issues: https://github.com/Stirling-Tools/Stirling-PDF/issues

classification:
  categories:
    - Documents
  tags:
    - pdf
    - document-conversion
    - ocr
    - editing
    - automation
  implementation_languages:
