tagline: Более 60 инструментов для PDF на собственном сервере
summary: >-
  Stirling PDF объединяет редактирование, конвертацию, OCR, сжатие, подпись и
  автоматическую обработку PDF в одном web-интерфейсе. Рецепт делает авторизацию
  обязательной, использует локальную H2 и привязывается к localhost, так что
  документы не попадают в облачный сервис.
categories:
  - Документы
license_notes: >-
  Корневая LICENSE применяет MIT только к коду вне отдельно перечисленных
  каталогов. В standard-образ входят компоненты под Stirling PDF User License.
  Публичное описание Free tier «до 5 users» не устраняет более узкие условия
  вложенной лицензии; карточка поэтому остаётся experimental и не является
  юридической консультацией.
security_known_risks:
  - PDF, изображения и офисные документы обрабатываются сложными нативными утилитами; специально созданные файлы могут атаковать парсеры или исчерпать CPU, RAM, временное место и диск.
  - URL-to-PDF имеет риск SSRF и явно выключен; не включайте его на публичном инстансе без отдельной сетевой изоляции и проверки upstream-защиты.
  - Встроенная H2, учётные записи и настройки находятся в /configs; повреждение или несогласованная копия этого каталога может сделать пользователей и конфигурацию недоступными.
  - Начальный пароль хранится в .env и действует только при создании первой базы; файл и backup нужно защищать как секреты, а пароль сменить после первого входа.
  - Лицензионные условия production и free tier до пяти пользователей сформулированы неоднозначно; проверьте допустимость своего сценария у Stirling PDF Inc.
license_restrictions:
  - Полный продукт имеет составную лицензию; каталоги proprietary и другие перечисленные в корневой LICENSE части регулируются Stirling PDF User License, а не MIT.
  - User License разрешает без подписки только внутреннюю оценку или minimal use и запрещает production, business-critical, client-facing и commercial use, распространение и обход лицензионных ограничений.
  - Upstream одновременно заявляет бесплатный план до пяти пользователей; неясно, расширяет ли это формулировки User License для production, поэтому перед таким использованием нужно получить подтверждение правообладателя.
smoke_test_limitations:
  - Полный прикладной HTTP smoke-тест прошёл на amd64; arm64 остаётся непроверенной из-за ограничений хоста WSL/QEMU.
  - Backup и восстановление H2 вместе с конфигурацией, custom files, pipeline и tessdata не проходили практическую проверку восстановления.
