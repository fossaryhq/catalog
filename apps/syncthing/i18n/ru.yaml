tagline: Синхронизация файлов между устройствами напрямую, без облака
summary: >-
  Syncthing держит выбранные папки одинаковыми на нескольких устройствах и
  передаёт файлы напрямую между ними по зашифрованному каналу. Промежуточного
  сервера нет: копия данных есть на каждом узле, а сервер в этом рецепте нужен
  как всегда доступный участник обмена.
categories:
  - Синхронизация файлов
license_notes: >-
  Официальное Android-приложение архивировано в декабре 2024 года; на Android
  и iOS Syncthing работает через приложения, которые поддерживает сообщество.
  Сервер, веб-интерфейс и десктопные сборки развиваются самим проектом.
security_known_risks:
  - "Порт синхронизации 22000 публикуется на всех интерфейсах: без этого узлы соединяются только через публичные relay и заметно медленнее. Веб-интерфейс при этом остаётся на 127.0.0.1."
  - Веб-интерфейс по умолчанию без пароля; перед публикацией на домене задайте пользователя и пароль в Settings → GUI.
  - "Архив конфигурации содержит приватный ключ устройства: получивший его сможет выдать себя за ваш узел, поэтому копии нужно шифровать."
  - "Syncthing синхронизирует удаления: ошибочно удалённый файл исчезнет на всех устройствах, если для папки не включено версионирование."
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 и ARMv7 пока не проверялись.
  - Smoke-тест поднимает один узел и проверяет API, права на каталог и сохранение ключа устройства, но не выполняет обмен файлами между двумя узлами.
screenshot_alts:
  - Главный экран Syncthing с двумя синхронизированными папками и подключённым удалённым устройством
  - Развёрнутая карточка папки с путём, числом файлов, типом синхронизации и настройкой версионирования
  - Карточка удалённого устройства с адресом, типом соединения и списком общих папок
  - Настройки веб-интерфейса с полями пользователя и пароля, переключателем HTTPS и выбором темы
  - Диалог редактирования папки с вкладками общего доступа, версионирования и правил исключения
