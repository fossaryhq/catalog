    vps: supported
    reliable: unsupported
  maintenance_difficulty: 2
  backup_supported: true
  restore_tested: true
  healthcheck: true
  reverse_proxy_required: true
  update_complexity: in_place

recipe:
  id: syncthing-compose
  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: v2.1.3
  images:
    - name: syncthing/syncthing
      tag_source: env
  tested_at: "2026-08-31"
  tested_architectures:
    amd64: passed
    arm64: not_tested
    armv7: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-08-31"
      application_version: v2.1.3
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
        armv7: not_tested
      smoke_test: full
      restore_tested: true
  license: MIT
  smoke_test_limitations:
    - Full smoke, backup, and restore passed on amd64; ARM64 and ARMv7 remain untested.
    - The smoke test starts a single node and checks the API, the data directory permissions, and that the device key survives a restore, but it does not exchange files between two nodes.

security:
  public_exposure: supported
  default_bind: all_interfaces
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - "The sync port 22000 is published on all interfaces: without it, nodes connect only through public relays and noticeably slower. The web interface still stays on 127.0.0.1."
    - The web interface has no password by default; set a user and password under Settings → GUI before publishing it on a domain.
    - "The configuration archive contains the devices private key: anyone who gets it can impersonate your node, so the copies must be encrypted."
    - "Syncthing synchronises deletions: a file removed by mistake disappears on every device unless file versioning is enabled for the folder."
  assessment:
    status: warnings
    assessed_at: "2026-08-31"

