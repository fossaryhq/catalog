schema_version: 6
publication_status: published

slug: syncthing
name: Syncthing
tagline: File synchronisation between devices, directly and without a cloud
summary: >-
  Syncthing keeps chosen folders identical on several devices and transfers
  files directly between them over an encrypted channel. There is no server in
  the middle: every node holds a copy, and the server in this recipe acts as the
  always-available participant in the exchange.

status: active
editorial_status: recommended

links:
  website: https://syncthing.net/
  source: https://github.com/syncthing/syncthing
  documentation: https://docs.syncthing.net/
  issues: https://github.com/syncthing/syncthing/issues

classification:
  categories:
    - File synchronisation
  tags:
    - sync
    - files
    - p2p
    - privacy
    - homelab
  implementation_languages:
    - Go
    - JavaScript
  alternatives_to:
    - Dropbox
    - Google Drive
    - Яндекс Диск

license:
  spdx: MPL-2.0
  kind: open_source
  restrictions: []
  notes: >-
    The official Android app was archived in December 2024; on Android and iOS
    Syncthing runs through community-maintained apps. The server, the web
    interface, and the desktop builds are developed by the project itself.

localization:
  ui_languages:
    - en
    - ru
  docs_languages:
    - en

clients:
  web: true
  android: true
  ios: true
  desktop: true

