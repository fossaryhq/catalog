tagline: Проверки доступности и статусная панель из YAML-конфигурации
summary: >-
  Gatus по расписанию проверяет HTTP, TCP, DNS, ICMP и сертификаты, сверяет ответы с заданными условиями и показывает историю на статусной панели. Этот рецепт хранит результаты в SQLite, защищает панель через Basic Auth и требует один небольшой контейнер.
categories:
  - Мониторинг
license_notes: null
security_known_risks:
  - Gatus отправляет запросы на заданные оператором адреса; тот, кто может изменить config.yaml, может исследовать сервисы, доступные из сети контейнера.
  - Данные Basic Auth и оповещений передаются через локальный файл .env; не добавляйте его в Git, задайте режим 600 и шифруйте внешние резервные копии.
  - Официальный контейнер по умолчанию работает от root, хотя этот рецепт не выдаёт ему дополнительные capabilities, host networking или каталоги хоста.
license_restrictions: []
smoke_test_limitations:
  - Smoke-тест приложения, включая резервное копирование и восстановление прошёл на amd64 2026-10-09. arm64 и armv7 в этом прогоне не проверялись.
screenshot_alts:
  - Панель Gatus с группами исправных проверок инфраструктуры и публичных сервисов в тёмной теме
  - Страница проверки с выполненными условиями и графиком истории времени ответа
  - Статусная панель Gatus с сообщением о завершённых работах над списком сервисов
