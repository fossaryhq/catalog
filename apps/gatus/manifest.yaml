schema_version: 6
publication_status: draft

slug: gatus
name: Gatus
tagline: Configuration-driven uptime checks and status dashboard
summary: >-
  Gatus runs HTTP, TCP, DNS, ICMP, and certificate checks from a YAML
  configuration, evaluates explicit conditions, and displays their history on a
  status dashboard. This recipe keeps results in SQLite, protects the dashboard
  with Basic Auth, and needs one small container.

status: active
editorial_status: experimental

