security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Gatus makes outbound requests to operator-defined targets; someone who can change config.yaml can probe services reachable from the container network.
    - Basic Auth and alerting credentials are supplied through the local .env file; keep it out of Git, set mode 600, and encrypt off-server backups.
    - The official container runs as root by default, although this recipe grants no extra capabilities, host networking, or host mounts.
  assessment:
    status: warnings
    assessed_at: "2026-09-22"

