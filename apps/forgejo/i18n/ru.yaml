tagline: Самостоятельный Git-сервис для кода, задач и совместной разработки
summary: >-
  Forgejo размещает Git-репозитории, pull request, задачи, wiki и реестр пакетов
  на собственном сервере. Рецепт использует rootless-образ, PostgreSQL и
  закрывает регистрацию, а web и SSH по умолчанию доступны только с localhost.
categories:
  - Разработка
license_notes: null
security_known_risks:
  - Git-сервис хранит исходный код, SSH-ключи, токены и webhooks; публичный web-доступ требует HTTPS, обновлений и строгой защиты учётных записей.
  - Публичный SSH увеличивает поверхность атаки и в рецепте привязан к localhost; открывайте его только осознанно и ограничивайте firewall.
  - "Forgejo Actions не настроены: подключение runner и выполнение недоверенных workflow требуют отдельной модели изоляции."
license_restrictions: []
smoke_test_limitations:
  - Полный smoke-тест прошёл на amd64 и arm64; процедуры backup и restore не проходили практическую проверку восстановления.
