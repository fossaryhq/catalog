tagline: Самостоятельный Git-сервис для кода, задач и совместной разработки
summary: >-
  Forgejo размещает Git-репозитории, pull request, задачи, wiki и реестр пакетов
  на собственном сервере. Рецепт использует rootless-образ, PostgreSQL и
  закрывает регистрацию, а web и SSH по умолчанию доступны только с localhost.
categories:
  - Разработка
license_notes: null
security_known_risks:
  - Git-сервис хранит исходный код, SSH-ключи, токены и webhooks; публичный web-доступ требует HTTPS, обновлений и строгой защиты учётных записей.
  - Публичный SSH увеличивает поверхность атаки и в рецепте привязан к localhost; открывайте его только осознанно и ограничивайте firewall.
  - "Forgejo Actions не настроены: подключение runner и выполнение недоверенных workflow требуют отдельной модели изоляции."
license_restrictions: []
smoke_test_limitations:
  - Полный smoke-тест прошёл на amd64 в последнем прогоне; на arm64 та же версия рецепта прошла 3 сентября 2026 года и с тех пор не перепроверялась.
  - Процедуры backup и restore не проходили практическую проверку восстановления.
screenshot_alts:
  - Панель после входа с календарём активности, лентой последних отправок, задач и релиза и списком репозиториев рядом
  - Страница репозитория в тёмной теме со счётчиками коммитов, веток и тегов, списком файлов с последним коммитом по каждому, адресом для клонирования и отрисованным README ниже
  - Список задач с пятью открытыми и одной закрытой, у каждой цветная метка, веха и автор
  - Запрос на слияние в тёмной теме с изменённым файлом и пятью добавленными строками, подсвеченными в диффе, и панелью рецензирования сверху
  - История коммитов ветки main с автором, коротким хешем, сообщением, тегом релиза и датой каждого коммита
