tagline: Личная лента RSS и Atom на собственном сервере
summary: >-
  FreshRSS собирает RSS и Atom-ленты, фильтрует статьи, хранит историю чтения и
  предоставляет API для сторонних мобильных и desktop-клиентов. Рецепт включает
  PostgreSQL 18, автоматическое обновление лент, детерминированный первый запуск
  и безопасную привязку web-порта к localhost.
categories:
  - RSS и новости
license_notes: >-
  Upstream называет лицензию GNU AGPL 3 без явного суффикса only/or-later.
  SPDX AGPL-3.0-only выбран консервативно; перед юридически значимым
  распространением проверьте заголовки исходных файлов и уточните намерение
  правообладателей.
security_known_risks:
  - Получение лент выполняется сервером и допускает запросы к private, loopback и link-local адресам; недоверенный пользователь может использовать это для SSRF.
  - Рецепт рассчитан на доверенного администратора и не задаёт несуществующую в FreshRSS 1.29.1 переменную INTERNAL_HOST_ALLOWLIST; для нескольких пользователей ограничьте исходящий доступ контейнера средствами сети.
  - TRUSTED_PROXY по умолчанию равен 0; широкий доверенный диапазон позволяет подделывать адрес клиента и опасные заголовки внешней аутентификации.
  - Сторонние расширения исполняют PHP-код с доступом к данным FreshRSS; устанавливайте только проверенный код и включайте его в backup.
  - Пароли администратора, API и PostgreSQL находятся в .env; файл и резервные копии нужно шифровать и хранить вне Git.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke-тест вместе с циклом backup и restore прошёл на amd64 и arm64.
  - На armv7 рецепт не работает — 32-битный PHP получает целочисленные столбцы PostgreSQL строками, FreshRSS 1.29.1 отклоняет их с TypeError в FreshRSS_Category::_error(), и пользователь так и не создаётся. Контейнер при этом остаётся healthy, поэтому проблему видно только по проверке учётной записи.
  - Миграция PostgreSQL между мажорными версиями не выполнялась; проверено только восстановление в пределах одного мажора.
screenshot_alts:
  - Основной поток с категориями, счётчиками непрочитанного и отмеченными статьями
  - Статья, открытая в области чтения, с лентой, автором и датой в тёмной теме
  - Управление подписками с лентами, разложенными по категориям
  - Настройки ленты с её адресом, категорией и временем последних обновлений
  - Основная статистика с числом прочитанных, непрочитанных и избранных статей и самыми активными лентами в тёмной теме
