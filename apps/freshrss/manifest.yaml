  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: 1.29.1
  images:
    - name: freshrss/freshrss
      tag_source: pinned
    - name: postgres
      tag_source: pinned
  tested_at: "2026-09-03"
  tested_architectures:
    amd64: passed
    arm64: passed
    armv7: passed
  smoke_test: full
  check_history:
    - tested_at: "2026-09-03"
      application_version: 1.29.1
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: passed
        armv7: passed
      smoke_test: full
      restore_tested: false
  license: MIT
  smoke_test_limitations:
    - The full HTTP smoke test passed on amd64, arm64, and armv7.
    - Backup, restore, and PostgreSQL migration procedures have not passed a practical restore test.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Feed retrieval runs on the server and permits private, loopback, and link-local destinations; an untrusted user can turn this into SSRF.
    - The recipe targets a trusted administrator and does not invent an INTERNAL_HOST_ALLOWLIST option absent from FreshRSS 1.29.1; enforce container egress restrictions for multiple users.
    - TRUSTED_PROXY defaults to 0; a broad trusted range enables client-address spoofing and dangerous external-auth headers.
    - Third-party extensions execute PHP with access to FreshRSS data; install reviewed code only and include extensions in backups.
    - Administrator, API, and PostgreSQL passwords live in .env; encrypt that file and backups and keep them out of Git.
  assessment:
    status: not_assessed
    assessed_at: null

