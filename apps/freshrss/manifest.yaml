schema_version: 6
publication_status: published

slug: freshrss
name: FreshRSS
tagline: A personal RSS and Atom reader on your own server
summary: >-
  FreshRSS collects RSS and Atom feeds, filters articles, keeps reading history,
  and offers APIs for third-party mobile and desktop clients. This recipe adds
  PostgreSQL 18, scheduled feed refreshes, a deterministic first run, and a web
  port bound safely to localhost.

status: active
editorial_status: experimental

links:
  website: https://freshrss.org/
  source: https://github.com/FreshRSS/FreshRSS
  documentation: https://freshrss.github.io/FreshRSS/en/
  issues: https://github.com/FreshRSS/FreshRSS/issues

classification:
  categories:
    - RSS and news
  tags:
    - rss
    - atom
    - feed-reader
    - news
    - api
  implementation_languages:
    - PHP
  alternatives_to:
    - Feedly
    - Inoreader
    - NewsBlur

license:
  spdx: AGPL-3.0-only
  kind: open_source
  restrictions: []
  notes: >-
    Upstream calls the license GNU AGPL 3 without an explicit only/or-later
    suffix. AGPL-3.0-only is the conservative SPDX choice here; inspect source
    file headers and confirm the copyright holders' intent before legally
    significant redistribution.

