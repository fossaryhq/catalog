tagline: Закладки, сохранённые страницы и заметки в одной библиотеке
summary: Karakeep сохраняет ссылки, читаемые копии страниц, снимки, изображения, PDF и текстовые заметки. Списки,
  теги и полнотекстовый поиск помогают организовать личную библиотеку. Рецепт включает SQLite, Meilisearch и браузер;
  AI-теги необязательны и не настроены.
categories:
- Закладки и архивирование
license_notes: Karakeep распространяется по AGPL-3.0; изменённые сетевые развёртывания несут обязательства по предоставлению
  исходного кода. Лицензия рецепта — MIT. У необязательных AI-провайдеров отдельные условия и стоимость; они не
  настроены.
license_restrictions: []
security_known_risks:
- Временно разрешайте регистрацию только через loopback или SSH-туннель, создайте первую учётную запись и закройте
  регистрацию до публикации прокси.
- Краулер загружает страницы, указанные пользователем, и раскрывает IP сервера. Базовая защита от SSRF не заменяет
  сетевые ограничения; допускайте только доверенных пользователей и ограничьте исходящий трафик краулера.
- Официальный браузер работает с --no-sandbox. Его порт DevTools должен оставаться закрытым; враждебные страницы
  могут исчерпать ресурсы или использовать уязвимость браузера.
- SQLite, сохранённые файлы, поисковый индекс, API-ключи и секреты сессий — приватные данные сервера без сквозного
  шифрования. Шифруйте копии и не добавляйте .env в Git.
- AI-провайдеры не настроены. Внешний провайдер может получать содержимое закладок и списывать оплату.
smoke_test_limitations:
- Healthcheck, создание учётной записи, закрытая регистрация, доступ к приватной заметке, загрузка и скачивание
  изображения, полнотекстовый поиск и восстановление после удаления обоих томов прошли на amd64. arm64 не проверялась.
- OIDC, внешние HTTPS-прокси, AI-провайдеры, мобильные клиенты, большие импорты и миграции между версиями не проверяются.
