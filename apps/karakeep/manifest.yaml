  tested_at: '2026-10-29'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  license: MIT
  smoke_test_limitations:
  - Full health, account creation, closed registration, private-note access, image upload/download, full-text search,
    and recovery after both volumes were removed passed on amd64. arm64 was not tested.
  - OIDC, external HTTPS proxies, AI providers, mobile clients, large imports, and cross-version migrations are
    not covered.
  check_history:
  - tested_at: '2026-10-29'
    application_version: 0.34.1
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - Temporarily enable registration only through loopback or an SSH tunnel, create the first account, then disable
    it before publishing a proxy.
  - The crawler fetches user-controlled pages and exposes the server IP. Basic SSRF protections are not a complete
    network boundary; restrict access to trusted users and restrict crawler egress.
  - The official browser runs with --no-sandbox. Its DevTools port must remain private; hostile pages can consume
    resources or exploit the browser.
  - SQLite, saved assets, search data, API keys, and session secrets are private server data, not end-to-end encrypted.
    Encrypt backups and keep .env out of Git.
  - AI providers are not configured. Enabling an external provider can send bookmark content off-server and incur
    charges.
  assessment:
    status: warnings
    assessed_at: '2026-10-29'
