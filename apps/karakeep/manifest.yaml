slug: karakeep
name: Karakeep
tagline: Bookmarks, saved pages, and notes in one library
summary: Karakeep saves links, readable pages, screenshots, images, PDFs, and text notes. Organize a private library
  with lists, tags, and full-text search. This recipe includes SQLite, Meilisearch, and a headless browser; AI tagging
  is optional and is not configured.
