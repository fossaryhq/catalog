tagline: Статьи для спокойного отложенного чтения
summary: Wallabag хранит читаемые копии статей с тегами, избранным, прогрессом чтения и аннотациями. Библиотека
  доступна в браузере и мобильных клиентах. Рецепт использует официальный образ и SQLite, закрывает регистрацию
  и меняет стандартный пароль до запуска веб-сервера.
categories:
- Закладки и архивирование
license_notes: Лицензия приложения и рецепта — MIT. У мобильных приложений и внешних сервисов собственные условия
  распространения; они не входят в комплект.
license_restrictions: []
security_known_risks:
- 'Инициализатор задаёт пароль администратора wallabag из .env до запуска веб-сервера. Сохраняйте имя учётной записи:
  её удаление или переименование блокирует инициализацию, а изменение пароля через интерфейс заменяется при инициализации.'
- Получение статей обращается к заданным пользователем URL с сервера. Допускайте доверенных пользователей и ограничивайте
  исходящий трафик для защиты внутренних сервисов и предотвращения SSRF.
- Статьи, кешированные изображения, данные RSS, OAuth-клиенты и копии не защищены сквозным шифрованием. Защитите
  хост, активный .env и зашифрованные внешние копии.
- Публичные ссылки на статьи и личные RSS-адреса дают доступ к соответствующему содержимому. Храните токены в тайне
  и проверяйте общий доступ перед публикацией материалов.
smoke_test_limitations:
- На amd64 проверены healthcheck, отклонение шаблонных учётных данных до запуска, вход администратора, закрытая
  регистрация, создание OAuth-клиента, приватная статья с тегами и восстановление после удаления обоих томов. Маркер
  в томе кешированных изображений восстановлен. ARM64 и ARMv7 не проверялись.
- TOTP/email-аутентификация вторым фактором, внешние HTTPS-прокси, SMTP, мобильные клиенты, большие импорты и миграции
  базы между версиями не проверялись.
screenshot_alts:
