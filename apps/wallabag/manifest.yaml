    tested_architectures:
      amd64: passed
      arm64: not_tested
      armv7: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - Full amd64 health, rejection of placeholder credentials before startup, administrator login, closed registration,
    OAuth client creation, private article/tags, and recovery after removal of both volumes were checked. A marker
    in the cached-image volume was restored. ARM64 and ARMv7 were not tested.
  - TOTP/email two-factor authentication, external HTTPS proxies, SMTP, mobile clients, large imports, and cross-version
    database migrations were not exercised.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The initializer owns the wallabag administrator password from .env and enforces it before the web server starts.
    Keep the account name; deleting or renaming it prevents initialization, and a UI password change is replaced
    on initialization.
  - Article retrieval contacts user-supplied URLs from the server. Limit access to trusted users and restrict egress
    to protect internal services and prevent SSRF.
  - Articles, cached images, RSS feed credentials, OAuth clients, and backups are not end-to-end encrypted. Protect
    the host, the active .env, and encrypted off-server copies.
  - Public article links and personal RSS URLs grant access to the content they expose. Keep tokens private and
    review sharing before publishing material.
  assessment:
    status: warnings
    assessed_at: '2026-10-29'
