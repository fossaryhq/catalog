slug: wallabag
name: Wallabag
tagline: Save articles for focused reading later
summary: Wallabag keeps readable copies of articles with tags, favourites, reading progress, and annotations. Read
  your library through the web interface or mobile clients. This recipe uses the official image and SQLite, disables
  registration, and replaces the upstream default password before the web server starts.
