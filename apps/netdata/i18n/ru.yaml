tagline: Метрики Linux-хоста с защищённым доступом
summary: Netdata собирает показатели CPU, памяти, дисков и сети Linux-хоста и хранит историю локально. Рецепт
  запускает официальный Agent за шлюзом с паролем, не публикует API агента и не требует учётной записи Cloud.
  Агент использует GPLv3+, но встроенный современный веб-интерфейс проприетарный.
categories:
- Мониторинг
license_notes: Agent открыт по GPLv3+, но официальный образ включает закрытый современный UI по NCUL1. Вся
  установка отмечена как проприетарная из-за UI, который не является ни открытым, ни source-available. NCUL1
  разрешает бесплатное использование с компонентами Netdata, но ограничивает изменение и обратную разработку.
  Netdata Cloud — отдельный сервис. Рецепт использует MIT; условия upstream сохранены в assets/NOTICE и соседних
  файлах лицензий.
license_restrictions:
- NCUL1 разрешает использование бинарного современного UI только с компонентами Netdata, запрещает изменение
  и обратную разработку и требует передавать условия при распространении.
- GPLv3+ Agent и включённые открытые компоненты сохраняют собственные лицензии; соблюдайте требования к уведомлениям
  и распространению исходников.
security_known_risks:
- Агент разделяет PID-пространство хоста и читает его корень, /proc, /sys и базы учётных записей. Эти монтирования
  раскрывают инфраструктуру и потенциально доступные секреты; используйте только доверенный закреплённый образ.
  Entrypoint стартует от root, агент переходит на UID/GID 201.
- В этой установке у агента нет локальных пользовательских учётных записей. Обязательный шлюз защищает UI/API
  паролем; /healthz намеренно сообщает только простой статус. Не публикуйте порт backend и не удаляйте шлюз.
  За пределами loopback используйте HTTPS или зашифрованный VPN.
- Оба тома и архивы содержат сведения о хосте, историю метрик, локальные управляющие/API-ключи и возможные
  секреты интеграций. Защитите .env и архивы, шифруйте внешние копии. Восстановление заменяет идентификатор
  агента и историю.
- Агент не подключён к Cloud, находится во внутренней сети Docker; DO_NOT_TRACK=1 отключает его телеметрию.
  Современный браузерный UI пытается обращаться к доменам Netdata, включая registry-iframe с идентификатором
  агента и именем хоста. Рецепт не обещает отсутствия стороннего браузерного трафика.
- Современный официальный UI использует ограничительную NCUL1 независимо от GPLv3+ агента. Облачный вход,
  платный SSO и сохранённые Cloud-панели не входят в рецепт и не настроены.
- Host networking, Docker socket, SYS_ADMIN/SYS_PTRACE и unconfined-профили не предоставлены. Часть привилегированных
  сборщиков и дескрипторов процессов недоступна. После новых монтирований хоста может понадобиться перезапуск
  агента; shared mount propagation не запрашивается.
- Trivy 0.74.0 обнаружил восемь CRITICAL-находок в пакетах образов Agent (семь) и Caddy (одна), с четырьмя
  различными CVE. Функциональная проверка восстановления их не устраняет.
smoke_test_limitations:
- Полный рецепт с удалением и пересозданием обоих томов проверен на amd64. Наличие образа ARM64 подтверждено,
  но запуск ARM64 не проверялся.
- Тест сравнивает число CPU с примонтированным /proc хоста, получает реальные графики CPU/RAM и фиксированные
  исторические значения CPU, восстанавливает исходный идентификатор агента и хеш API-ключа и точно сравнивает
  историю.
- Анонимные запросы UI и API метрик получают 401; проверены авторизованный API, отказ для повреждённого архива,
  неизменность исходной копии, страховочный backup и backup остановленной установки.
- Мониторится Linux-хост Docker. Под Docker Desktop это Linux-VM, а не окружающее оборудование Windows/macOS.
  Read-only-монтирования не доказывают полный доступ к физическим устройствам.
- Docker socket, дополнительные SYS_ADMIN/SYS_PTRACE и unconfined-профиль не предоставлены. Дескрипторы процессов,
  привилегированные сборщики, GPU, SMART, eBPF, systemd-журналы, streaming, Cloud-вход/SSO и доставка уведомлений
  не проверялись.
- Современный UI без подключения агента ограничивает таблицы функций Live и настройки учётной записи. Скриншоты
  используют доступную стандартную тёмную тему без Cloud-аккаунта.
