  - observability
  implementation_languages:
  - Go
  - C
  - Rust
  alternatives_to:
  - Netdata Cloud
license:
  spdx: GPL-3.0-or-later AND LicenseRef-Netdata-Cloud-UI-1.0
  kind: proprietary
  restrictions:
  - NCUL1 permits the binary modern UI only with Netdata components, forbids modification and reverse engineering,
    and requires its terms to accompany redistribution.
  - The GPLv3+ Agent and redistributed open-source components retain their own licenses; preserve applicable
    notices and source-distribution obligations.
  notes: The Agent is open-source GPLv3+, while the official image bundles the closed-source modern UI under
    NCUL1. The combined deployment is classified as proprietary because that UI is not open source or source-available.
    NCUL1 allows free use with Netdata components but restricts modification/reverse engineering. Netdata
    Cloud is a separate service. The recipe is MIT; assets/NOTICE and the adjacent license files record upstream
    terms.
