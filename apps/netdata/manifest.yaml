  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: '>=2.24.0'
  application_version: 2.12.2
  images:
  - name: netdata/netdata
    tag_source: env
  - name: caddy
    tag_source: pinned
  tested_at: '2026-10-30'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-30'
    application_version: 2.12.2
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - The full recipe and complete loss/recreation of both data volumes were tested on amd64. ARM64 image availability
    was checked, but ARM64 runtime was not tested.
  - The test compares reported CPU cores with mounted host /proc, records real CPU/RAM charts and fixed historical
    CPU samples, restores the original Agent identity and API-key hash, and verifies the historical values
    exactly.
  - Anonymous UI and metric APIs return 401; authenticated APIs, invalid archive rejection, source archive
    integrity, a safety backup and stopped-state backup were exercised.
  - The Linux Docker host is the monitored system. Under Docker Desktop this is the Linux VM, not the surrounding
    Windows/macOS hardware. Read-only host mounts do not prove complete physical-device visibility.
  - No Docker socket, extra SYS_ADMIN/SYS_PTRACE capabilities or unconfined security profile is granted. Per-process
    descriptors, privileged collectors, GPU, SMART, eBPF, systemd logs, streaming, Cloud login/SSO and notification
    delivery were not tested.
  - The unclaimed modern UI restricts Live function tables and account settings. Screenshots use its available
    default dark theme without a Cloud account.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The Agent shares the host PID namespace and reads host root, /proc, /sys and account databases. These
    mounts expose infrastructure details and potentially readable secrets; run only a trusted pinned image.
    The entrypoint starts as root and the Agent drops to UID/GID 201.
  - The Agent has no local user accounts in this deployment. The mandatory gateway authenticates UI/API requests;
    /healthz intentionally reveals only a plain health response. Never publish the backend port or remove
    the gateway. Use HTTPS or an encrypted VPN beyond loopback.
  - Both data volumes and backups contain host inventory, historical metrics, local management/API keys and
    possible integration secrets. Keep .env and backups private and encrypt off-server copies. A data restore
    replaces the Agent identity and history.
  - The Agent remains unclaimed on an internal Docker network and DO_NOT_TRACK=1 opts out of Agent telemetry.
    The modern browser UI attempts to contact Netdata domains, including a registry iframe carrying the Agent
    identifier and hostname. This recipe does not claim zero third-party browser traffic.
  - The official modern UI uses restrictive NCUL1, independently of the GPLv3+ Agent. Cloud authentication,
    paid SSO and saved Cloud dashboards are outside this recipe and are not enabled.
  - Host networking, Docker socket, SYS_ADMIN/SYS_PTRACE and unconfined security profiles are deliberately
    absent. Some privileged collectors and per-process descriptors are unavailable. New host mounts may require
    restarting the Agent; this recipe does not request shared mount propagation.
  - Trivy 0.74.0 found eight CRITICAL package findings across the Agent (seven) and Caddy (one), with four
    distinct CVE identifiers. Functional recovery testing does not fix those findings.
  assessment:
    status: warnings
    assessed_at: '2026-10-30'
