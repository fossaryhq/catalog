schema_version: 6
publication_status: published
slug: netdata
name: Netdata
tagline: Live host metrics with protected local access
summary: Netdata collects Linux host CPU, memory, disk and network measurements and keeps local metric history.
  This recipe runs the official Agent behind a password-protected gateway, without publishing the Agent API
  or requiring a Cloud account. The Agent is GPLv3+; the bundled modern web UI is proprietary.
status: active
editorial_status: experimental
