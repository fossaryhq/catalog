schema_version: 6
publication_status: draft
slug: open-webui
name: Open WebUI
tagline: A private chat interface for models on your server
summary: Open WebUI brings conversations, files, and knowledge collections to a browser interface
  for local language models. This CPU recipe connects the official app to an internal Ollama
  server, creates an administrator from private environment settings, and disables public
  signup and external OpenAI-compatible providers.
status: active
editorial_status: experimental
links:
  website: https://openwebui.com/
  source: https://github.com/open-webui/open-webui
  documentation: https://docs.openwebui.com/
  issues: https://github.com/open-webui/open-webui/issues
classification:
  categories:
  - AI assistants
  tags:
  - ai
  - chat
  - local-llm
  - ollama
  implementation_languages:
  - Python
  - JavaScript
  - TypeScript
  alternatives_to:
  - ChatGPT
  - Claude
license:
  spdx: LicenseRef-Open-WebUI
  kind: source_available
  restrictions:
  - Redistributions must retain copyright notices, license conditions, and the disclaimer.
  - Open WebUI branding may not be altered, removed, obscured, or replaced above 50 end users
    in a rolling 30-day period without prior written permission or an applicable enterprise
    license; the standard recipe preserves it.
  - The copyright holder and contributor names may not endorse derived products without prior
    written permission.
  notes: 'The Open WebUI License adds branding conditions to BSD-style terms and is recorded
    as source available. It does not cap ordinary use at 50 users: the threshold concerns
    branding changes. Ollama is MIT licensed; model weights have their own licenses. The small
    Qwen3 0.6B example is Apache-2.0 licensed and is downloaded separately.'
localization:
  ui_languages:
  - en
  - ru
  docs_languages:
  - en
  - ru
