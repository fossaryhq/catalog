  installation_levels:
    home: supported
    vps: supported
    reliable: unsupported
  maintenance_difficulty: 3
  backup_supported: true
  restore_tested: true
  healthcheck: true
  reverse_proxy_required: false
  update_complexity: in_place
recipe:
  id: open-webui-compose
  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: '>=2.24.0'
  application_version: v0.12.3
  images:
  - name: ghcr.io/open-webui/open-webui
    tag_source: env
  - name: ollama/ollama
    tag_source: env
  - name: alpine
    tag_source: pinned
  tested_at: '2026-10-23'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-23'
    application_version: v0.12.3
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - The amd64 smoke checks CPU inference with Qwen3 0.6B, administrator login, blocked signup,
    private chats/files, exact file bytes, model digest, and recovery after removing both
    volumes; arm64 was not tested.
  - GPU acceleration, large models, model-answer quality, voice, web search, plugins, external
    providers, OIDC/MFA, and reverse-proxy integration were not exercised.
  - The smoke uploads a file without embedding/retrieval processing; it does not establish
    RAG accuracy. Model weights require a separate network download and a separate license
    review.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - Conversations, uploads, model data, and settings can contain private information. Protect
    both volumes, the original service secret, and encrypted off-server backups.
  - Administrator Functions and Tools can run code on the server. Grant administrator access
    only to trusted people; this recipe supplies no Docker socket, cloud provider keys, or
    host data mounts.
  - Keep signup disabled and Ollama private. The initial administrator password is stored
    in .env; changing bootstrap environment values does not rotate an existing account password.
  - Language-model output can be wrong or contain unsafe instructions. Review answers before
    acting; model licenses and resource needs are separate from the web interface.
  - Settings saved in the UI can override initial environment defaults. Recheck provider access,
    registration, and sharing permissions after changes or recovery.
  assessment:
    status: warnings
    assessed_at: '2026-10-23'
