tagline: Приватный чат с моделями на своём сервере
summary: Open WebUI объединяет переписки, файлы и базы знаний в браузерном интерфейсе для
  локальных языковых моделей. CPU-рецепт подключает официальный образ к внутреннему серверу
  Ollama, создаёт администратора из закрытой .env и отключает публичную регистрацию и внешних
  OpenAI-совместимых провайдеров.
categories:
- AI-ассистенты
license_notes: 'Лицензия Open WebUI добавляет к BSD-подобным условиям требования к брендингу;
  приложение отмечено как source available. Обычное использование не ограничено 50 пользователями:
  порог относится к изменению брендинга. Ollama использует MIT, у весов моделей свои лицензии.
  Небольшой пример Qwen3 0.6B использует Apache-2.0 и скачивается отдельно.'
license_restrictions:
- При распространении сохраняйте уведомления об авторских правах, условия лицензии и отказ
  от гарантий.
- Нельзя изменять, убирать, скрывать или заменять брендинг Open WebUI при числе конечных пользователей
  свыше 50 за скользящие 30 дней без письменного разрешения или соответствующей enterprise-лицензии;
  штатный рецепт сохраняет брендинг.
- Нельзя использовать имена правообладателя и участников для продвижения производных продуктов
  без письменного разрешения.
security_known_risks:
- Переписки, загрузки, модели и настройки могут содержать личную информацию. Защищайте оба
  тома, исходный секрет сервиса и зашифрованные внешние копии.
- Администраторские Functions и Tools могут запускать код на сервере. Давайте права администратора
  только доверенным людям; рецепт не передаёт Docker socket, ключи облачных провайдеров и
  данные хоста.
- Сохраняйте закрытую регистрацию и приватный Ollama. Начальный пароль администратора записан
  в .env; правка переменных первичного создания не меняет пароль существующего аккаунта.
- Ответы модели могут быть неверными или содержать опасные инструкции. Проверяйте их перед
  действием; лицензии и требования моделей отличаются от веб-интерфейса.
- Сохранённые в UI настройки могут перекрывать начальные переменные окружения. Проверяйте
  доступ провайдеров, регистрацию и общий доступ после изменений и восстановления.
smoke_test_limitations:
- На amd64 проверены CPU-генерация Qwen3 0.6B, вход администратора, закрытая регистрация,
  приватность чатов/файлов, точные байты файла, digest модели и восстановление после удаления
  обоих томов; arm64 не проверялась.
- GPU, большие модели, качество ответов, голос, веб-поиск, плагины, внешние провайдеры, OIDC/MFA
  и интеграция с обратным прокси не проверялись.
- Smoke загружает файл без обработки embeddings/retrieval и не подтверждает точность RAG.
  Веса моделей скачиваются отдельно по сети и требуют отдельной проверки лицензии.
