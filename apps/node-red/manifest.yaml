slug: node-red
name: Node-RED
tagline: Low-code flows for automation, APIs, and connected devices
summary: >-
  Node-RED is a visual programming environment for connecting devices, APIs,
  and online services. Build event-driven flows in a browser, extend them with
  JavaScript and community nodes, and run the result on your own server. This
  recipe protects the editor with a password and keeps flows and credentials in
  a persistent volume.

