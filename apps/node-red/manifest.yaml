      tag_source: env
  tested_at: "2026-10-03"
  tested_architectures:
    amd64: passed
    arm64: not_tested
    armv7: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-10-03"
      application_version: 5.0.7
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
        armv7: not_tested
      smoke_test: full
      restore_tested: true
  license: MIT
  smoke_test_limitations:
    - Full smoke and restore passed on amd64; ARM64 and ARMv7 are untested.
    - The smoke flow verifies the editor API and runtime; third-party palette nodes and external integrations are not tested.

security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Anyone with editor credentials can deploy arbitrary JavaScript through Function nodes and install third-party palette packages, which run with the container's permissions.
    - Flows may contain API tokens and passwords. NODE_RED_CREDENTIAL_SECRET and the backup archive are needed to decrypt them, so protect .env and off-server backups like passwords.
    - The editor controls every configured webhook and integration. Keep it behind HTTPS, use a unique password, and do not expose port 1880 directly.
  assessment:
    status: warnings
    assessed_at: "2026-10-03"

