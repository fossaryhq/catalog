tagline: Low-code потоки для автоматизации, API и подключённых устройств
summary: >-
  Node-RED — визуальная среда программирования для соединения устройств, API и онлайн-сервисов. Собирайте событийные потоки в браузере, расширяйте их JavaScript и community-узлами и запускайте на собственном сервере. Этот рецепт защищает редактор паролем и хранит потоки с учётными данными в постоянном томе.
categories:
  - Автоматизация
license_notes: null
license_restrictions: []
security_known_risks:
  - Тот, кто получил доступ к редактору, может запускать произвольный JavaScript через Function-узлы и устанавливать сторонние пакеты палитры с правами контейнера.
  - В потоках могут быть токены API и пароли. NODE_RED_CREDENTIAL_SECRET и архив резервной копии нужны для их расшифровки, поэтому .env и внешние копии нужно защищать как пароли.
  - Редактор управляет всеми настроенными webhook и интеграциями. Используйте HTTPS, уникальный пароль и не публикуйте порт 1880 напрямую.
smoke_test_limitations:
  - Smoke-тест приложения, включая резервное копирование и восстановление прошёл на amd64 2026-10-09. arm64 и armv7 в этом прогоне не проверялись.
  - Smoke-flow проверяет API редактора и runtime; сторонние узлы палитры и внешние интеграции не проверяются.
