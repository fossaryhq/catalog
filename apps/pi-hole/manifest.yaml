    reliable: unsupported
  maintenance_difficulty: 2
  backup_supported: true
  restore_tested: true
  healthcheck: true
  reverse_proxy_required: false
  update_complexity: in_place

recipe:
  id: pi-hole-compose
  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: ">=2.24.0"
  application_version: "2026.09.0"
  images:
    - name: pihole/pihole
      tag_source: env
  tested_at: "2026-10-03"
  tested_architectures:
    amd64: passed
    arm64: not_tested
    armv7: not_tested
  smoke_test: full
  check_history:
    - tested_at: "2026-10-03"
      application_version: "2026.09.0"
      recipe_version: 1
      tested_architectures:
        amd64: passed
        arm64: not_tested
        armv7: not_tested
      smoke_test: full
      restore_tested: true
  license: MIT
  smoke_test_limitations:
    - Full DNS, web API, backup, and restore smoke passed on amd64; ARM64 and ARMv7 are untested.
    - DHCP, NTP, and external DNS-over-HTTPS are not enabled by this recipe and were not tested.

security:
  public_exposure: not_recommended
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
    - Publishing port 53 on a public address creates an open resolver that can be abused for DNS amplification; the default bind is localhost.
    - The query database records domains requested by network clients; restrict access to the panel and set retention deliberately.
    - A password set through .env is visible to users who can inspect the Docker container; protect .env and limit Docker access.
    - The built-in DHCP service cannot work through this recipe's bridge network without additional network and capability changes, and is not enabled.
  assessment:
    status: warnings
    assessed_at: "2026-10-03"

