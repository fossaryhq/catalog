schema_version: 6
publication_status: published

slug: pi-hole
name: Pi-hole
tagline: Network-wide ad blocking with a self-hosted DNS server
summary: >-
  Pi-hole filters DNS requests for every device on a home network, including
  TVs and phones that cannot use a browser extension. Its web dashboard shows
  query statistics, client activity, and allow and deny lists. This recipe runs
  the official container with persistent SQLite data, a local control panel,
  and DNS bound to localhost until you choose a trusted LAN or VPN address.

status: active
editorial_status: experimental

links:
  website: https://pi-hole.net/
  source: https://github.com/pi-hole/pi-hole
  documentation: https://docs.pi-hole.net/docker/
  issues: https://github.com/pi-hole/pi-hole/issues

classification:
  categories:
    - Networking
  tags:
    - dns
    - adblock
    - privacy
    - homelab
    - filtering
  implementation_languages:
    - C
    - JavaScript
  alternatives_to:
    - NextDNS
    - AdGuard DNS
    - Cloudflare Gateway

license:
  spdx: EUPL-1.2
  kind: open_source
  restrictions: []
  notes: >-
    Pi-hole Core, FTL, and the web interface use EUPL-1.2. The container also
    bundles third-party components under their own licences. The recipe itself
    is MIT-licensed.

localization:
  ui_languages:
