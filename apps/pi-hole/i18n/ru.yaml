tagline: Блокировка рекламы во всей сети с собственным DNS-сервером
summary: >-
  Pi-hole фильтрует DNS-запросы всех устройств домашней сети, включая телевизоры и телефоны, где нельзя установить браузерное расширение. Веб-панель показывает статистику запросов, активность клиентов и списки разрешённых и запрещённых доменов. Рецепт запускает официальный контейнер с постоянной базой SQLite, локальной панелью и DNS на localhost, пока вы не выберете доверенный адрес LAN или VPN.
categories:
  - Сеть
license_notes: >-
  Pi-hole Core, FTL и веб-интерфейс распространяются по EUPL-1.2. В контейнер входят сторонние компоненты со своими лицензиями. Сам рецепт — под MIT.
license_restrictions: []
security_known_risks:
  - Публикация порта 53 на публичном адресе создаёт открытый резолвер, который используют для DNS-амплификации; по умолчанию привязка только к localhost.
  - База запросов хранит домены, запрошенные клиентами сети; ограничьте доступ к панели и осознанно задайте срок хранения.
  - Пароль из .env виден пользователям, которым доступен просмотр Docker-контейнера; защищайте .env и ограничьте доступ к Docker.
  - Встроенный DHCP не работает через bridge-сеть этого рецепта без дополнительных изменений сети и привилегий, поэтому он не включён.
smoke_test_limitations:
  - Smoke-тест приложения, включая резервное копирование и восстановление прошёл на amd64 2026-10-09. arm64 и armv7 в этом прогоне не проверялись.
  - DHCP, NTP и внешний DNS-over-HTTPS в рецепте не включены и не проверялись.
