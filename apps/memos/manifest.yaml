  saml: none
  two_factor: none
  proxy_header: false
requirements:
  architectures:
  - amd64
  - arm64
  min_cpu_cores: 1
  min_ram_mb: 256
  recommended_ram_mb: 512
  min_disk_gb: 1
  gpu:
    required: false
    supported: false
  database: sqlite
  dependencies: []
operations:
  install_difficulty: 2
  installation_levels:
    home: supported
    vps: supported
    reliable: unsupported
  maintenance_difficulty: 2
  backup_supported: true
  restore_tested: true
  healthcheck: true
  reverse_proxy_required: false
  update_complexity: in_place
recipe:
  id: memos-compose
  version: 1
  compose_file: compose.yaml
  env_example: .env.example
  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: '>=2.24.0'
  application_version: 0.31.0
  images:
  - name: neosmemo/memos
    tag_source: env
  - name: alpine
    tag_source: pinned
  tested_at: '2026-10-23'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-23'
    application_version: 0.31.0
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - Full health, first-admin setup, closed registration, private-note/file access, note creation,
    attachment upload, and recovery after volume removal ran on amd64; arm64 was not tested.
  - OAuth2/OIDC, external reverse proxies, webhooks, remote storage, imports, and third-party
    clients were not exercised.
  recheck_interval_days: 30
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The first visitor can create the administrator account. Finish setup through loopback
    or an SSH tunnel before exposing the reverse proxy.
  - Instance administrators can read and manage private notes. Private visibility is access
    control, not end-to-end encryption; share tokens can grant additional access.
  - The data volume and backups include accounts, notes, attachments, and session secrets.
    Encrypt off-server backups and protect the active configuration.
  assessment:
    status: warnings
    assessed_at: '2026-10-23'
