schema_version: 6
publication_status: draft
slug: memos
name: Memos
tagline: Private Markdown notes with tags and attachments
summary: Memos keeps short Markdown notes, checklists, tags, and attachments on your own server.
  Capture household references, reading notes, and daily ideas in a searchable timeline. This
  recipe uses the official image, SQLite, local files, private instance access, and disabled
  public registration.
status: active
editorial_status: experimental
links:
  website: https://usememos.com/
  source: https://github.com/usememos/memos
  documentation: https://usememos.com/docs
  issues: https://github.com/usememos/memos/issues
classification:
  categories:
  - Knowledge management
  tags:
  - notes
  - markdown
  - knowledge
  - personal
  implementation_languages:
  - Go
  - TypeScript
  alternatives_to:
  - Google Keep
license:
  spdx: MIT
  kind: open_source
  restrictions: []
  notes: The application and this recipe are MIT licensed. Browser access is included; third-party
    clients are not bundled or verified.
localization:
