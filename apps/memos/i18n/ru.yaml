tagline: Приватные Markdown-заметки с тегами и вложениями
summary: Memos хранит короткие Markdown-заметки, списки дел, теги и вложения на вашем сервере.
  Ведите домашние справочники, заметки о прочитанном и повседневные идеи в ленте с поиском.
  Рецепт использует официальный образ, SQLite, локальные файлы, приватный доступ к инстансу
  и закрытую публичную регистрацию.
categories:
- Управление знаниями
license_notes: Приложение и рецепт распространяются по MIT. Доступ через браузер включён;
  сторонние клиенты не входят в комплект и не проверялись.
license_restrictions: []
security_known_risks:
- Первый посетитель может создать администратора. Завершите настройку через loopback или SSH-туннель
  до открытия обратного прокси.
- Администраторы инстанса могут читать и изменять приватные заметки. Приватность — это контроль
  доступа, а не сквозное шифрование; токены ссылок могут давать дополнительный доступ.
- Том данных и резервные копии содержат аккаунты, заметки, вложения и секреты сессий. Шифруйте
  внешние копии и защищайте рабочую конфигурацию.
smoke_test_limitations:
- На amd64 проверены здоровье, создание первого администратора, закрытая регистрация, защита
  заметки и файла, создание заметок, загрузка вложения и восстановление после удаления тома;
  arm64 не проверялась.
- OAuth2/OIDC, внешние обратные прокси, вебхуки, внешние хранилища, импорт и сторонние клиенты
  не проверялись.
