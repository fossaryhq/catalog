tagline: Личная фототека с поиском, картой и распознаванием лиц
summary: >-
  PhotoPrism индексирует фотографии и видео на вашем сервере, группирует их по
  датам, местам и людям, читает метаданные и предоставляет поиск через браузер.
  Рецепт использует MariaDB, хранит оригиналы локально и публикует web-интерфейс
  только через localhost.
categories:
  - Фото и видео
license_notes: >-
  Community Edition распространяется по GNU AGPL 3. Upstream добавляет к
  тексту лицензии отдельные условия для товарного знака PhotoPrism и брендовых
  материалов; платные редакции распространяются по другой лицензии.
security_known_risks:
  - Фототека содержит лица, геометки и другие чувствительные метаданные; шифруйте диск и внешние резервные копии.
  - Встроенный HTTP не защищает трафик до reverse proxy; публичный доступ допустим только через HTTPS.
  - Индексация недоверенных изображений, RAW и видео нагружает внешние декодеры и может исчерпать CPU, RAM или диск.
  - Пароли администратора, MariaDB и root MariaDB находятся в `.env`; установите права 600 и не добавляйте файл в Git.
license_restrictions:
  - Товарный знак PhotoPrism и брендовые материалы регулируются отдельными условиями в тексте upstream-лицензии.
smoke_test_limitations:
  - Полный HTTP smoke-тест прошёл на amd64 в последнем прогоне; на arm64 та же версия рецепта прошла 3 сентября 2026 года и с тех пор не перепроверялась.
  - Индексация медиа, распознавание лиц, backup и restore не проходили практическую проверку.
screenshot_alts:
  - "Фотобиблиотека в тёмной теме: сетка снимков с названиями, форматом, размером и именем файла, два отмечены звёздочкой"
  - Один снимок открыт в просмотрщике — название под ним, сверху кнопки сведений, увеличения, слайд-шоу, полного экрана и редактирования
  - "Та же библиотека списком в светлой теме: дата съёмки и камера, прочитанные из метаданных каждого снимка"
  - "Страница альбомов в светлой теме: два альбома с обложкой, названием и числом снимков"
  - "Настройки в тёмной теме: тема, язык интерфейса и часовой пояс, а также переключатели альбомов, людей, меток, обмена и файлового браузера"
