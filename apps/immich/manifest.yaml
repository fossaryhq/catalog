  # application version, so only Immich's own images belong in the policy.
  images:
    - image: ghcr.io/immich-app/immich-server
      provider: ghcr
      repository: immich-app/immich-server
    - image: ghcr.io/immich-app/immich-machine-learning
      provider: ghcr
      repository: immich-app/immich-machine-learning
  compose:
    url: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
    baseline_sha256: sha256:c651a8211c9ab152bf7060ba1f370737ad2b4872da788a6c8a9e7fa7d4217357

