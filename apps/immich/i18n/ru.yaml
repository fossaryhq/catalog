tagline: Своя фотогалерея с мобильной синхронизацией и умным поиском
summary: >-
  Immich хранит фотографии и видео на вашем сервере, автоматически загружает их
  с телефона и показывает привычную ленту с альбомами, картой и поиском по
  содержимому. Рецепт поднимает сервер, машинное обучение, PostgreSQL с
  векторным поиском и Valkey одним Compose-файлом.
categories:
  - Фото и видео
license_notes: >-
  Immich распространяется по AGPL-3.0 и полностью работоспособен без оплаты.
  Платная лицензия Immich является добровольной поддержкой проекта и не
  открывает дополнительных функций.
security_known_risks:
  - Фотоархив содержит геометки, лица и другие чувствительные метаданные; публикуйте его только по HTTPS и шифруйте резервные копии.
  - "Рецепт не задаёт лимиты CPU и памяти: задания машинного обучения могут занять все ресурсы сервера."
  - Пароль PostgreSQL хранится в файле `.env` рядом с рецептом; закройте файл правами 600 и не добавляйте его в Git.
  - Без ограничения размера тела запроса на reverse proxy загрузка видео может исчерпать диск; задавайте квоты пользователям в панели администратора.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 пока не проверялся.
  - Smoke-тест поднимает стек и проверяет API, но не загружает медиа и не проверяет распознавание лиц и умный поиск.
screenshot_alts:
  - Лента Immich с фотографиями, сгруппированными по датам, в тёмной теме
  - Список альбомов с обложками, периодом съёмки и числом снимков в светлой теме
  - Результаты умного поиска по запросу о горах и озере без ручных тегов
  - Просмотр снимка с боковой панелью даты, размера файла и связанного альбома
  - Настройки машинного обучения в панели администратора с разделами умного поиска, дубликатов, лиц и OCR
