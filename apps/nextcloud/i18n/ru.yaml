tagline: Своё облако с файлами, календарём и совместной работой
summary: >-
  Nextcloud — облачное хранилище на вашем сервере: файлы синхронизируются с
  компьютером и телефоном, папки открываются коллегам по ссылке или по имени, а
  сверху добавляются календарь, контакты и заметки. Рецепт поднимает сервер,
  PostgreSQL, Valkey и отдельный контейнер фоновых заданий.
categories:
  - Облачные хранилища
license_notes: >-
  Сервер и клиенты свободны и не требуют подписки. Nextcloud GmbH продаёт
  отдельную корпоративную подписку с поддержкой и несколькими закрытыми
  дополнениями; на функциональность этого рецепта она не влияет.
security_known_risks:
  - Пароли администратора и базы задаются в `.env` и попадают в окружение контейнера; закройте файл правами 600 и не добавляйте его в Git.
  - "Nextcloud хранит файлы, календари и контакты сразу нескольких людей: публикуйте его только по HTTPS и включайте двухфакторную аутентификацию."
  - Приложения из встроенного магазина выполняют код на сервере; ставьте только те, которым доверяете.
  - Рецепт не задаёт лимиты CPU и памяти, а фоновые задания и генерация превью на слабом сервере способны занять все ресурсы.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 и ARMv7 пока не проверялись.
  - Smoke-тест поднимает стек, проверяет режим фоновых заданий и блокировку через Redis и восстанавливает базу из дампа, но не проверяет синхронизацию desktop- и мобильных клиентов.
screenshot_alts:
  - Файловый менеджер Nextcloud со списком папок, размерами и датами изменения в светлой теме
  - Панель общего доступа к папке с правами пользователя, внутренней ссылкой и публичной ссылкой
  - Каталог с фотографиями в режиме плитки с превью изображений в тёмной теме
  - Управление учётными записями со списком пользователей, групп и прав администратора
  - Раздел проверок безопасности и настройки с предупреждениями об HTTPS и заголовках в тёмной теме
