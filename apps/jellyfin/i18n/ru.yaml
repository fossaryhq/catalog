tagline: Свой медиасервер для фильмов, сериалов и музыки
summary: >-
  Jellyfin превращает домашний сервер в медиатеку: он находит файлы, подтягивает
  обложки и описания, помнит место остановки и раздаёт видео на телевизор,
  телефон и браузер. Полностью свободен, без подписки, аккаунта и обязательного
  облака.
categories:
  - Медиасерверы
license_notes: >-
  Jellyfin полностью свободен: в нём нет платных функций, подписки и
  обязательной учётной записи у разработчика. Проект является форком Emby до
  его перехода на закрытую лицензию.
security_known_risks:
  - "Мастер первичной настройки не защищён паролем: до создания администратора порт нельзя открывать наружу."
  - Контейнер работает от root, как в официальной инструкции upstream; для снижения рисков задайте `user:` и права на каталоги вручную.
  - "Транскодирование нагружает процессор: один поток 4K способен занять весь сервер, поэтому публичный доступ стоит ограничивать числом пользователей."
  - DLNA и автообнаружение в локальной сети требуют host network и в рецепте отключены; их включение снимает сетевую изоляцию контейнера.
license_restrictions: []
smoke_test_limitations:
  - Полный smoke, backup и restore пройдены на amd64; ARM64 пока не проверялся.
  - Smoke-тест поднимает сервер и проверяет API, но не воспроизводит медиа и не проверяет транскодирование.
screenshot_alts:
  - Главный экран Jellyfin с медиатекой, продолжением просмотра и недавно добавленными фильмами в тёмной теме
  - Сетка библиотеки фильмов с обложками, годами выпуска и отметкой просмотренного в светлой теме
  - Страница фильма с постером, описанием, жанрами, параметрами видео и списком съёмочной группы
  - Встроенный веб-плеер с панелью управления, шкалой воспроизведения и оставшимся временем
  - Панель администратора с версией сервера, библиотеками, подключёнными устройствами и журналом активности
