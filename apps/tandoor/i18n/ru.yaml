tagline: Рецепты, меню на неделю и общие списки покупок
summary: Tandoor хранит домашние рецепты с ингредиентами, шагами приготовления и фотографиями, планирует блюда
  в календаре и превращает меню в общие списки покупок. Рецепт запускает Tandoor с PostgreSQL, постоянными
  медиафайлами и пересоздаваемой статикой; внешние AI-сервисы и хранилища необязательны и не настроены.
categories:
- Еда и кулинария
