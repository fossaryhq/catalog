security_known_risks:
- Первый посетитель может стать владельцем через /setup/. Завершите настройку через loopback или SSH-туннель
  до открытия прокси и доступа из сети; обычная публичная регистрация выключена.
- Загруженные медиафайлы отдаёт Nginx без проверки доступа к каждому изображению. Приватный рецепт не делает
  URL фотографии приватным файлом; не загружайте чувствительные изображения.
- Импорт URL выполняет исходящие запросы с сервера. Допускайте доверенных пользователей и ограничьте доступ
  контейнера к чувствительным внутренним сервисам; AI и внешние хранилища не настроены.
- База, том медиа и архивы содержат домашние данные и секреты интеграций. Ограничьте доступ к .env и томам,
  шифруйте внешние копии и сохраняйте совпадающий SECRET_KEY.
- При запуске PostgreSQL мигрирует автоматически. До понижения версии восстановите совместимый архив до обновления;
  одной смены тега образа недостаточно.
- 'Upstream 2.7.2 отвечает HTTP 500 при повторном открытии /setup/ после создания владельца (issue #4907).
  Для обычного входа используйте /account/login/; рецепт не патчит аутентификацию upstream.'
- Trivy обнаружил 5 CRITICAL-находок в пакетах образов приложения, PostgreSQL и Alpine. Функциональная проверка
  их не устраняет.
smoke_test_limitations:
- Полная проверка нативного рецепта и восстановления после потери томов выполнена на amd64; arm64 не проверялась.
- Тест создаёт владельца через штатную CSRF-форму, входит через браузерный API аутентификации, сохраняет приватный
  рецепт с ингредиентами, инструкциями, тегом и изображением, удаляет все три тома и проверяет восстановленные
  данные и хеш сохранённой фотографии.
- Закрытая регистрация проверяется через API конфигурации аутентификации; анонимный доступ к API рецептов запрещён.
  Известный баг перенаправления /setup/ после создания владельца описан и не засчитывается как успешная проверка
  защиты.
- Сроки меню, синхронизация покупок, импорт внешних URL, OIDC/SAML, remote-user, почта, AI и сторонние мобильные
  клиенты не проверяются сценарием восстановления.
