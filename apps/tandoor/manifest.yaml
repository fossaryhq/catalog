  installation: installation.md
  troubleshooting: troubleshooting.md
  supported_docker_compose: '>=2.24.0'
  application_version: 2.7.2
  images:
  - name: vabene1111/recipes
    tag_source: env
  - name: postgres
    tag_source: pinned
  - name: alpine
    tag_source: pinned
  tested_at: '2026-10-29'
  tested_architectures:
    amd64: passed
    arm64: not_tested
  smoke_test: full
  check_history:
  - tested_at: '2026-10-29'
    application_version: 2.7.2
    recipe_version: 1
    tested_architectures:
      amd64: passed
      arm64: not_tested
    smoke_test: full
    restore_tested: true
  license: MIT
  smoke_test_limitations:
  - The complete native recipe and volume-loss recovery scenario ran on amd64; arm64 was not tested.
  - The test creates the owner through the native CSRF form, logs in through the browser authentication API,
    saves a private recipe with ingredients, instructions, keyword and an uploaded image, removes all three
    volumes, and verifies restored data and the stored image hash.
  - Public signup is checked through the authentication configuration API and anonymous recipe access is denied.
    The known upstream /setup/ redirect bug after owner creation is documented, not counted as a successful
    security check.
  - Meal-plan timing, shopping synchronization, external URL imports, OIDC/SAML, remote-user login, email,
    AI services and third-party mobile clients are not exercised by the recovery test.
security:
  public_exposure: supported
  default_bind: localhost
  privileged: false
  host_network: false
  docker_socket: false
  known_risks:
  - The first visitor can become the owner through /setup/. Complete setup over loopback or an SSH tunnel before
    enabling a proxy or LAN access; ordinary public signup is disabled.
  - Uploaded media are served by Nginx without per-image authorization. A private recipe does not turn its
    image URL into a private file; do not upload sensitive images.
  - URL imports make server-side outbound requests. Limit accounts to trusted users and restrict access from
    the container to sensitive internal services; AI and external storage providers are not configured.
  - The database, media volume and archives contain household information and integration credentials. Restrict
    access to .env and volumes, encrypt off-server backups and keep the matching SECRET_KEY.
  - Startup migrates PostgreSQL automatically. Restore a compatible pre-upgrade archive before downgrading;
    changing the image tag alone is not a safe rollback.
  - 'Upstream 2.7.2 returns HTTP 500 when /setup/ is revisited after an owner exists (issue #4907). Use /account/login/
    for normal access; the recipe does not patch upstream authentication.'
  - Trivy found 5 CRITICAL package findings across the application, PostgreSQL and Alpine images. Functional
    verification does not resolve those findings.
  assessment:
    status: warnings
    assessed_at: '2026-10-29'
