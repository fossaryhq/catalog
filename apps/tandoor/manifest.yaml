name: Tandoor
tagline: Recipes, meal plans, and shared shopping lists
summary: Tandoor organizes household recipes with ingredients, cooking steps and images, plans meals on a calendar,
  and turns planned dishes into shared shopping lists. This recipe runs Tandoor with PostgreSQL, persistent
  media and regenerated static files; external AI and storage services are optional and unconfigured.
